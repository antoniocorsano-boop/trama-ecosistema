<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRAMA Context Help isolated evidence</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;--bg:#061522;--panel:#0b2235;--line:#315b74;--text:#e8f1f7;--muted:#a9bdca;--info:#58bff7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
main{max-width:760px;margin:0 auto;padding:32px 18px;display:grid;gap:18px}
.helpable{cursor:help;outline:none}
.helpable:focus-visible{box-shadow:0 0 0 3px var(--info)}
.card{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.help-popover{position:fixed;z-index:40;right:18px;bottom:18px;inset:auto 18px 18px auto;margin:0;width:min(390px,calc(100vw - 24px));padding:14px 16px;border:1px solid #47708a;border-radius:14px;background:#0b2235f5;color:var(--text);box-shadow:0 20px 50px #0008;display:none;pointer-events:none}
.help-popover.open{display:block}\n@supports selector(:popover-open){.help-popover:popover-open{display:block}}
.help-popover strong{display:block;margin-bottom:4px}
.help-popover div{color:var(--muted)}
@media(max-width:700px){.help-popover{left:8px;right:8px;bottom:18px;inset:auto 8px 18px 8px;width:auto;max-height:45vh;overflow:auto;padding:16px;border-radius:16px}}
</style>
</head>
<body>
<main>
  <h1>Context Help isolated fixture</h1>
  <section class="card helpable" tabindex="0" data-help-title="Gate aperti" data-help="Gate bloccanti che richiedono evidenza o una decisione umana.">
    <strong>Gate aperti</strong>
    <p>Porta il focus qui per mostrare l’aiuto contestuale.</p>
  </section>
  <section class="card helpable" tabindex="0" data-help-title="Maturità" data-help="I livelli riflettono evidenze governate collegate, non un punteggio di qualità.">
    <strong>Maturità</strong>
    <p>Secondo target isolato per cambio contenuto e pointer.</p>
  </section>
</main>
<div id="helpPopover" class="help-popover" role="tooltip" aria-live="polite" aria-hidden="true" popover="manual">
  <strong id="helpTitle"></strong>
  <div id="helpText"></div>
</div>
<script src="../context-help.js"></script>
<script>window.__contextHelp=window.TRAMAContextHelp.initContextHelp(document)</script>
</body>
</html>
