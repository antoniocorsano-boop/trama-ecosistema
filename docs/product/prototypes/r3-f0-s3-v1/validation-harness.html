<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>S3-V2 validation harness</title>
  <!-- S3-V2 residual overflow diagnostic v2 -->
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    iframe { display: block; width: 320px; height: 800px; border: 0; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <iframe id="subject" src="index.html" title="Atlas prototype under validation"></iframe>
  <pre id="result" data-validation="PENDING">PENDING</pre>
  <script>
    const frame = document.getElementById("subject");
    const result = document.getElementById("result");

    frame.addEventListener("load", () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const tests = {};

      const root = doc.documentElement;
      tests.reflow320 =
        root.scrollWidth <= win.innerWidth + 1 &&
        doc.body.scrollWidth <= win.innerWidth + 1;

      const map = doc.querySelector(".map-canvas");
      const mapFigure = doc.querySelector(".map-figure");
      const equivalentList = doc.getElementById("elenco");
      tests.mobileMapFallback =
        !!map &&
        !!mapFigure &&
        !!equivalentList &&
        getComputedStyle(mapFigure).display === "none" &&
        getComputedStyle(equivalentList).display !== "none";

      const first = doc.getElementById("tab-lezioni");
      const second = doc.getElementById("tab-obiettivi");
      first.focus();
      first.dispatchEvent(new KeyboardEvent("keydown", {
        key: "ArrowRight",
        bubbles: true
      }));

      tests.tabsArrowRight =
        doc.activeElement === second &&
        second.getAttribute("aria-selected") === "true" &&
        first.getAttribute("aria-selected") === "false" &&
        doc.getElementById("lezioni").hidden === true &&
        doc.getElementById("obiettivi").hidden === false;

      second.dispatchEvent(new KeyboardEvent("keydown", {
        key: "Home",
        bubbles: true
      }));

      tests.tabsHome =
        doc.activeElement === first &&
        first.getAttribute("aria-selected") === "true";

      const details = doc.querySelector("details.provenance");
      const summary = details.querySelector("summary");
      summary.click();
      tests.disclosureToggle = details.open === true;

      const skip = doc.querySelector(".skip-link");
      skip.focus();
      tests.skipLinkVisibleOnFocus =
        parseFloat(getComputedStyle(skip).top) >= 0;

      const focusTargets = [
        doc.querySelector(".primary-nav a"),
        doc.querySelector(".year-switcher .is-current"),
        summary,
        first,
        doc.querySelector('.view-switcher a[href="#elenco"]'),
        doc.querySelector(".action-link")
      ].filter(Boolean);

      const focusDiagnostics = focusTargets.map((el) => {
        el.focus({ preventScroll: true });
        const style = getComputedStyle(el);
        const receivesFocus = doc.activeElement === el;
        const focusIndicator =
          style.outlineStyle !== "none" &&
          parseFloat(style.outlineWidth || "0") >= 2;
        return {
          tag: el.tagName,
          text: (el.textContent || "").trim().slice(0, 80),
          receivesFocus,
          focusIndicator
        };
      });
      tests.focusTargetsReceiveFocus =
        focusDiagnostics.every((item) => item.receivesFocus);
      tests.focusIndicatorVisible =
        focusDiagnostics.every((item) => item.focusIndicator);

      const persistentOverlays = Array.from(doc.querySelectorAll("body *"))
        .filter((el) => {
          const style = getComputedStyle(el);
          if (!["fixed", "sticky"].includes(style.position)) {
            return false;
          }
          const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0 && style.visibility !== "hidden";
        })
        .map((el) => ({
          tag: el.tagName,
          id: el.id || "",
          className: typeof el.className === "string" ? el.className : "",
          position: getComputedStyle(el).position
        }));
      tests.noPersistentAuthorOverlay = persistentOverlays.length === 0;

      tests.stateTextSurvivesWithoutColor =
        doc.body.textContent.includes("CurricularStatus · CORRENTE") &&
        doc.body.textContent.includes("EditorialStatus · RITIRATA") &&
        doc.body.textContent.includes("UIFeedbackStatus · ERRORE TEMPORANEO");

      const overflowers = Array.from(doc.querySelectorAll("*"))
        .map((el) => {
          const r = el.getBoundingClientRect();
          return {
            tag: el.tagName,
            id: el.id || "",
            className: typeof el.className === "string" ? el.className : "",
            text: (el.textContent || "").trim().slice(0, 60),
            left: Math.round(r.left),
            right: Math.round(r.right),
            width: Math.round(r.width)
          };
        })
        .filter((item) => item.right > win.innerWidth + 1 || item.left < -1)
        .slice(0, 30);

      const nonMapOverflowers = Array.from(doc.querySelectorAll("*"))
        .filter((el) => !el.closest(".map-canvas"))
        .map((el) => {
          const r = el.getBoundingClientRect();
          return {
            tag: el.tagName,
            id: el.id || "",
            className: typeof el.className === "string" ? el.className : "",
            text: (el.textContent || "").trim().slice(0, 60),
            left: Math.round(r.left),
            right: Math.round(r.right),
            width: Math.round(r.width)
          };
        })
        .filter((item) => item.right > win.innerWidth + 1 || item.left < -1)
        .slice(0, 20);

      const internalOverflowers = Array.from(doc.querySelectorAll("body *"))
        .filter((el) => !el.closest(".map-canvas"))
        .map((el) => ({
          tag: el.tagName,
          id: el.id || "",
          className: typeof el.className === "string" ? el.className : "",
          text: (el.textContent || "").trim().slice(0, 60),
          clientWidth: el.clientWidth,
          scrollWidth: el.scrollWidth
        }))
        .filter((item) => item.scrollWidth > item.clientWidth + 1)
        .slice(0, 30);

      const textOverflowers = [];
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
      while (walker.nextNode() && textOverflowers.length < 30) {
        const node = walker.currentNode;
        if (!node.nodeValue || !node.nodeValue.trim()) continue;
        const parent = node.parentElement;
        if (!parent || parent.closest(".map-canvas") || getComputedStyle(parent).display === "none") continue;
        const range = doc.createRange();
        range.selectNodeContents(node);
        const r = range.getBoundingClientRect();
        if (r.right > win.innerWidth + 1 || r.left < -1) {
          textOverflowers.push({
            parent: parent.tagName,
            className: typeof parent.className === "string" ? parent.className : "",
            text: node.nodeValue.trim().slice(0, 80),
            left: Math.round(r.left),
            right: Math.round(r.right),
            width: Math.round(r.width)
          });
        }
      }

      const passed = Object.values(tests).every(Boolean);
      result.dataset.validation = passed ? "PASS" : "FAIL";
      result.textContent = JSON.stringify({
        viewport: {
          width: win.innerWidth,
          height: win.innerHeight,
          documentClientWidth: root.clientWidth,
          bodyClientWidth: doc.body.clientWidth
        },
        scroll: {
          root: root.scrollWidth,
          body: doc.body.scrollWidth
        },
        tests,
        overflowers,
        nonMapOverflowers,
        internalOverflowers,
        textOverflowers,
        persistentOverlays,
        focusDiagnostics
      }, null, 2);
    });
  </script>
</body>
</html>
