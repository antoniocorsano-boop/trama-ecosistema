  generator:
    family: Qwen-Image
    license: Apache-2.0
    role: canonical-character-and-environment-baseline
  editor:
    family: Qwen-Image-Edit
    license: Apache-2.0
    role: controlled-scene-editing-and-continuity
  refiner:
    name: Krita
    role: human-refinement
  accelerator:
