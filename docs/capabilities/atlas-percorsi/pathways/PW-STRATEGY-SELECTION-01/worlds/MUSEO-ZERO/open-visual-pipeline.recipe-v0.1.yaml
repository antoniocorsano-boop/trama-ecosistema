    output: SALA-ZERO-CANON-01
    maxExploratoryRuns: 4
  - id: OP1
    output: LIA-CANON-01
    maxExploratoryRuns: 4
  - id: OP2
    output: F3-TOO-LATE-01
    maxExploratoryRuns: 4
  - id: OP3
    output: F4-BACKSTAGE-CLUE-01
    maxExploratoryRuns: 4
  - id: OP4
    output: HUMAN_REFINED_PLATES
  - id: OP5
    output: REFERENCE_LOCK_DECISION

hardStops:
  - HS02
  - HS03
  - HS04
  - HS05
  - HS07

platePolicy:
  generatedLearnerText: PROHIBITED
  generatedDialogueText: PROHIBITED
  generatedFinalUi: PROHIBITED
