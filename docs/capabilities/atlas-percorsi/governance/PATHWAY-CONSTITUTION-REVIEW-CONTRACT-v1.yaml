schema: atlas.percorsi.pathway-constitution-review/v1
status: PROPOSED_FOR_REVIEW
runtime_authorized: false
constitution_ref: governance/CHILD-SAFE-LEARNING-EXPERIENCE-CONSTITUTION-v1.md
purpose: >-
  Machine-checkable declaration contract for pathway dossiers. Structural checks
  support review but never replace pedagogical, accessibility, privacy, child-safety
  or human governance judgement.

review_states: [NOT_REVIEWED, PASS, CHANGES_REQUIRED, BLOCKED]
claim_states: [DESIGN_HYPOTHESIS, PROTOTYPE_OBSERVATION, ATLAS_VALIDATED_LOCAL_EFFECT, TRANSFER_EVIDENCE, NOT_ESTABLISHED]
evidence_states: [SUPPORTED, UNCERTAIN, UNSUPPORTED, CONTRAINDICATED]

required:
  pathway:
    id: string
    title: string
    dossier_ref: string
    gate: string
    status: string
    intended_developmental_band:
      enum: [EARLIER_PRIMARY, LATER_PRIMARY, LOWER_SECONDARY, MULTI_BAND]
    runtime_authorized: {const: false}

  competence:
    target: string
    observable_task_performances: {type: array, min_items: 1}
    prohibited_trait_inferences: {type: array, min_items: 1}
    claim_state: {enum_ref: claim_states}
    claim_ceiling: string

  learner_agency:
    meaningful_choice_present: boolean
    revision_or_recovery_supported: boolean
    coercive_engagement_patterns: {const: []}
    human_review_required: true

  reflection:
    task_bound: true
    sensitive_personal_disclosure_required: {const: false}
    fictional_or_hypothetical_option: boolean
    age_appropriate_form_declared: true

  cognitive_demand:
    task_demand: string
    representation_demand: string
    navigation_demand: string
    narrative_demand: string
    avoidable_memory_load_externalised: boolean
    speed_used_as_default_competence_proxy: {const: false}
    stable_anchors_declared: true

  media:
    salient_assets_classified: true
    allowed_function_classes: [STRUCTURAL, ORIENTING, NARRATIVE_CAUSAL, AFFECTIVE_SAFE, ACCESSIBILITY, ATMOSPHERIC, DECORATIVE]
    decorative_assets_justified: boolean
    motion_necessity_declared: true
    cognitive_continuity_reviewed: true

  narrative:
    universal_metaphor_required: {const: false}
    character_used: boolean
    pseudo_therapeutic_role: {const: false}
    simulated_dependency_or_exclusive_intimacy: {const: false}
    confidential_disclosure_solicited: {const: false}

  child_agent_interaction:
    applies_when_character_or_agent_interacts: true
    artificial_nature_clear_to_learner: true
    transparency_form_age_appropriate: true
    claims_human_like_inner_experience: {const: false}
    claims_privileged_psychological_understanding: {const: false}
    asks_for_secrets: {const: false}
    asks_for_sensitive_personal_disclosure: {const: false}
    reciprocal_personal_self_disclosure_to_elicit_child_disclosure: {const: false}
    exclusivity_language: {const: false}
    dependency_or_attachment_framing: {const: false}
    empathy_used_as_retention_mechanism: {const: false}
    relational_pressure_to_continue: {const: false}
    question_inventory_required: true
    question_inventory_fields:
      - id
      - exact_or_pattern_text
      - pedagogical_function
      - expected_response_type
      - personal_data_possible
      - sensitive_data_possible
      - retention_or_transmission
      - developmental_band
      - human_review_state
    allowed_question_functions:
      - TASK_ORIENTATION
      - EVIDENCE_INSPECTION
      - COMPARISON
      - CONSEQUENCE_PREDICTION
      - STRATEGY_SELECTION
      - TASK_BOUND_REFLECTION
      - REVISION
      - CLARIFICATION
    prohibited_question_functions:
      - SECRET_SOLICITATION
      - INTIMATE_BIOGRAPHY
      - HEALTH_OR_DISTRESS_PROBING
      - FAMILY_OR_RELATIONSHIP_PROBING
      - IDENTITY_SENSITIVE_PROBING
      - PSYCHOLOGICAL_DIAGNOSIS
      - RELATIONAL_DEPENDENCY_BUILDING
    free_text_child_input:
      enum: [NONE, BOUNDED_LOCAL_ONLY, SEPARATELY_GOVERNED]
    if_free_text_not_none_require:
      - necessity
      - minimisation
      - input_boundary
      - local_or_server_processing
      - retention
      - accidental_sensitive_disclosure_handling
      - human_review_state
    trust_boundary_declared: true
    epistemic_claims_sourceable_or_bounded: true
    character_liking_not_used_as_evidence_of_learning: true
    anthropomorphism_not_used_as_default_engagement_goal: true
    evidence_refs_required:
      - research/evidence/error-agent-emotion-records-v1.yaml

  transfer:
    claimed: boolean
    if_claimed_require: [source_context, target_context, changed_dimensions, invariant_structure, support_level, observable_action, claim_ceiling]
    completion_alone_used_as_transfer_evidence: {const: false}

  privacy:
    student_account_required: {const: false}
    real_name_required: {const: false}
    personal_biography_required: {const: false}
    behavioural_profile_created: {const: false}
    cross_pathway_psychological_dossier: {const: false}
    hidden_psychometric_score: {const: false}
    server_side_telemetry: {enum: [NONE, SEPARATELY_GOVERNED]}
    data_inventory_ref: string
    child_agent_data_flow_declared: true
    accidental_sensitive_disclosure_persisted: {const: false}

  accessibility:
    essential_meaning_single_sensory_channel: {const: false}
    colour_only_essential_signal: {const: false}
    reduced_motion_reviewed: true
    alternative_representation_declared: true
    construct_equivalence_human_review_required: true

  emotional_safety:
    shame_or_humiliation_mechanism: {const: false}
    fear_as_performance_mechanism: {const: false}
    punitive_exit: {const: false}
    error_recovery_declared: true
    uncomfortable_scenario_exit_declared: true
    relational_reassurance_substitutes_for_task_feedback: {const: false}

  teacher_sovereignty:
    autonomous_diagnosis: {const: false}
    autonomous_psychological_remediation: {const: false}
    task_evidence_and_inference_distinguished: true
    provenance_and_limits_visible_to_teacher: true

  evidence:
    evidence_register_ref: string
    reasoning_chain_present: true
    evidence_state: {enum_ref: evidence_states}
    falsification_or_change_condition_present: true

  human_reviews:
    pedagogical: {required: true, state: {enum_ref: review_states}}
    child_safety_privacy: {required: true, state: {enum_ref: review_states}}
    accessibility: {required: true, state: {enum_ref: review_states}}
    developmental: {required: true, state: {enum_ref: review_states}}
    child_agent_interaction: {required_when_applicable: true, state: {enum_ref: review_states}}
    exact_head:
      required_before_promotion: true
      reviewed_commit: null
      state: {enum_ref: review_states}

automatic_constitutional_stops:
  - {code: C1_TRAIT_INFERENCE, when: "prohibited trait/psychological inference is configured or produced"}
  - {code: C2_COERCIVE_ENGAGEMENT, when: "dark pattern, artificial urgency, loss-framed streak, manipulative scarcity or dependency mechanism is configured"}
  - {code: C3_HUMILIATION, when: "shame, humiliation or fear is used as a performance mechanism"}
  - {code: C4_INVASIVE_DISCLOSURE, when: "sensitive personal disclosure is required for pathway operation or reflection"}
  - {code: C11_PSEUDO_THERAPY, when: "a character/system diagnoses, solicits confidential disclosure or simulates therapeutic/intimate dependency"}
  - {code: C11_SECRET_SOLICITATION, when: "a character/system asks for secrets or intimate/sensitive biography"}
  - {code: C11_FALSE_INNER_LIFE, when: "a character/system claims human-like inner experience or privileged psychological understanding of the learner"}
  - {code: C11_RELATIONAL_RETENTION, when: "empathy, exclusivity, attachment or relational pressure is used to retain the learner"}
  - {code: C11_UNREVIEWED_QUESTION, when: "an interactive child-facing question has no declared pedagogical function or required review metadata"}
  - {code: C14_PRIVACY, when: "account, real identity, behavioural profile, cross-pathway psychological dossier or hidden psychometric score is required without separately approved governance"}
  - {code: C14_SENSITIVE_DISCLOSURE_PERSISTENCE, when: "accidental sensitive disclosure from a child is configured for persistence"}

promotion_rule: >-
  A structurally valid contract is necessary but never sufficient. Promotion requires
  all mandatory human reviews PASS, exact-head review PASS, no constitutional stop,
  evidence/provenance traceability, and explicit runtime authority from the correct
  governance process. This contract itself never grants runtime authority.
