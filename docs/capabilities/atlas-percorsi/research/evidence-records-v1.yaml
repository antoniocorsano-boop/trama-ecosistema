provenance_gaps:
  - constitution_rule: C12
    gap: "Transfer-specific screened records must be normalised from the transfer research packets before constitutional promotion."
  - constitution_rule: C13
    gap: "Claim-calibration and transfer-measurement evidence must be normalised explicitly."
  - constitution_rule: C3
    gap: "Direct evidence on educational feedback/error framing and emotional safety should be strengthened."
  - constitution_rule: C11
    gap: "Direct child-safety evidence on anthropomorphic agents, relational framing and pseudo-therapeutic interaction should be added."
  - constitution_rule: C16
    gap: "Emotion-regulation/SEL evidence needs dedicated normalised records with implementation and age limitations."

normalisation_rule: >-
  Empty or weak provenance is visible debt, not permission to fill gaps by intuition.
  A constitutional rule may remain precautionary/governance-based while evidence is
  strengthened, but its authority type and limitation must remain explicit.