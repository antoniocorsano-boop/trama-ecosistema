# Temporary one-shot retry 2026-10-05: remove after the two P2 findings are remediated.
name: Audit v1.2 review remediation

on:
  push:
    branches:
      - "docs/audit-v1-2-p6-closure"
    paths:
      - "scripts/fix_audit_v12_review.py"
      - ".github/workflows/audit-v12-review-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/audit-v1-2-p6-closure
          fetch-depth: 1
      - name: Apply focused review remediation
        run: python scripts/fix_audit_v12_review.py
      - name: Materialize governed Project Knowledge projections
        run: |
          python scripts/build_project_context_snapshot.py
          python scripts/build_trama_context_pack.py project-knowledge --output control-center/data/context-packs/project-knowledge.json
      - name: Verify focused regression
        run: python -m unittest tests.test_p3_status_alignment -v
      - name: Commit reconciled sources and projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/audits/TRAMA-AUDIT-2026-10-03.md \
            status/project-knowledge-events.json \
            control-center/data/project-context-snapshot.json \
            control-center/data/context-packs/project-knowledge.json
          if git diff --cached --quiet; then
            echo "AUDIT_V1_2_REVIEW_ALREADY_REMEDIATED"
            exit 0
          fi
          git commit -m "docs(audit): address v1.2 review findings"
          git push origin HEAD:docs/audit-v1-2-p6-closure
