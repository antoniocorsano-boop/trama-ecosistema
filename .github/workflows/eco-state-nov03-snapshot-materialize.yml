name: TEMP ECO-STATE November canonical snapshot materialization

on:
  pull_request:
    paths:
      - ".github/workflows/eco-state-nov03-snapshot-materialize.yml"
      - "governance/access/trama-ecosystem-state-v0.3.json"

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/eco-state-v03-nov03-admission'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install canonical validator
        run: python -m pip install --disable-pip-version-check --quiet jsonschema

      - name: Revalidate governed v0.3 graph
        run: |
          python scripts/test_ecosystem_state_v03_contract.py
          python scripts/test_ecosystem_state_v03_work_admission.py
          python scripts/test_ecosystem_graph_projection.py

      - name: Generate canonical snapshot
        run: python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json

      - name: Guard and publish exactly one generated file to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "control-center/data/ecosystem-snapshot.json" || {
            printf 'UNEXPECTED_DELTA: %s\n' "$changed"
            exit 1
          }
          python scripts/build_ecosystem_snapshot.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- control-center/data/ecosystem-snapshot.json
          git commit -m 'chore(snapshot): regenerate ecosystem graph after governed November admission'
          git push origin 'HEAD:refs/heads/feat/eco-state-v03-nov03-admission'
