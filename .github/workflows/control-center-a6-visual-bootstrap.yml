name: Control Center A6 Visual Baseline Bootstrap
on:
  pull_request:
    paths:
      - "apps/control-center/e2e/a6-visual.spec.ts"
      - ".github/workflows/control-center-a6-visual-bootstrap.yml"
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Generate visual baselines
        run: npx playwright test e2e/a6-visual.spec.ts --update-snapshots
      - name: Persist visual baselines only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/a6-visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "BASELINES_ALREADY_CURRENT"
            exit 0
          fi
          git commit -m "A6: persist visual regression baselines"
          git push origin "HEAD:${{ github.head_ref }}"
