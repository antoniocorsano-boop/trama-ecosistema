name: Audio Factory AF-02 — provini italiani autorizzati

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audio-factory-af02-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  kokoro-italian-voice-trial:
    if: >-
      github.event.pull_request.number == 303 &&
      github.event.label.name == 'af02-provino-autorizzato' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/audio-factory-af01-kokoro-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Read candidate PR head only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Network preflight (no long DNS retries)
        shell: bash
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import socket
          import sys
          hosts = ("security.ubuntu.com", "pypi.org", "huggingface.co")
          failures = []
          for host in hosts:
              try:
                  socket.getaddrinfo(host, 443)
                  print(f"DNS_OK: {host}")
              except OSError:
                  failures.append(host)
                  print(f"NETWORK_DNS_UNAVAILABLE: {host}", file=sys.stderr)
          if failures:
              sys.exit(1)
          PY
      - name: Local voice dependencies (bounded)
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v espeak-ng >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo timeout 90s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 update -qq
            sudo timeout 90s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 install -y -qq espeak-ng ffmpeg
          fi
          python -m pip install --retries 1 --timeout 20 -r services/audio-factory/requirements-kokoro.txt
      - name: Generate exactly two governed Italian candidates
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p af02-artifacts
          python - <<'PY'
          from pathlib import Path
          import json
          source=Path("services/audio-factory/tests/fixtures/missione118_provino.json")
          plan=json.loads(source.read_text(encoding="utf-8"))
          for voice in ("im_nicola", "if_sara"):
              adapted=dict(plan, voice=voice, request_id="missione118-"+voice.replace("_","-"))
              Path("af02-artifacts",voice+".json").write_text(
                  json.dumps(adapted,indent=2,ensure_ascii=False)+"\n",encoding="utf-8"
              )
          PY
          failures=0
          for voice in im_nicola if_sara; do
            echo "### $voice" >> "$GITHUB_STEP_SUMMARY"
            python services/audio-factory/cli.py \
              --plan "af02-artifacts/$voice.json" \
              --output "af02-artifacts/$voice" \
              --allow-model-download --mp3
            result=$?
            echo "AF-02 executor exit code: $result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "At least one Italian voice is not technically qualified. No automatic approval." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Both candidates need an independent human pronunciation review; not authorized for publication." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve bounded trial evidence, even when rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af02-italian-voice-trial
          path: af02-artifacts/
          if-no-files-found: warn
          retention-days: 7
