name: Visual Factory — Diagram Design acquisition
on:
  pull_request:
    paths:
      - ".github/workflows/visual-factory-diagram-design.yml"
      - "fixtures/visual-factory-diagram/**"
permissions:
  contents: read
jobs:
  pinned-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: b228c5d77794a84150fca41b22940bb316b1398d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire pinned public source without checkout or upstream execution
        shell: bash
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/diagram-design.git"
          git -C "$RUNNER_TEMP/diagram-design.git" -c core.hooksPath=/dev/null fetch --no-tags --depth=1 https://github.com/cathrynlavery/diagram-design.git "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/diagram-design.git" rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/vf-diagram-receipt"
          git -C "$RUNNER_TEMP/diagram-design.git" ls-tree -r -l "$SOURCE_SHA" > "$RUNNER_TEMP/vf-diagram-receipt/tree.txt"
          git -C "$RUNNER_TEMP/diagram-design.git" archive --format=tar "$SOURCE_SHA" | sha256sum > "$RUNNER_TEMP/vf-diagram-receipt/archive.sha256"
      - name: Verify source inventory and collect static review evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          receipt = root / "vf-diagram-receipt"
          sha = os.environ["SOURCE_SHA"]
          git = ["git", "-C", str(root / "diagram-design.git")]
          expected = {
              "THIRD_PARTY_LICENSES.md": "5311158e2621738d0f9f6efa09dc7c7ef05b160a",
              "skills/diagram-design/SKILL.md": "3b41b0f61db73b0e0a4505439b827bb2cd412e51",
              "scripts/test-self-check.py": "7a8fb7f965d60f10ad211a8ca64bc521e9ecaebb",
              "scripts/test-export-svg-standalone.py": "5473e39b4641c6c8176bb579cdd7369392f12dc3",
              "scripts/test-lint-a11y.py": "34d8fd9628d4bbefe072f6ec5f0d17e311c37273",
              "scripts/verify-geometry.py": "5ef14827f57fe2484344f4b381fe17f1b5092206",
          }
          files = {}
          for path in ["LICENSE", "PRIVACY.md", "SECURITY.md", ".github/workflows/ci.yml", *expected]:
              blob = subprocess.check_output(git + ["show", f"{sha}:{path}"])
              digest = hashlib.sha1(b"blob " + str(len(blob)).encode() + b"\0" + blob).hexdigest()
              if path in expected and digest != expected[path]:
                  raise SystemExit(f"Blob mismatch: {path}")
              files[path] = {"git_blob_sha1": digest, "sha256": hashlib.sha256(blob).hexdigest(), "bytes": len(blob)}
          license_text = subprocess.check_output(git + ["show", f"{sha}:LICENSE"])
          if b"MIT License" not in license_text:
              raise SystemExit("Expected MIT license text absent")
          entries = subprocess.check_output(git + ["ls-tree", "-rz", sha]).split(b"\0")
          imports, review = {}, []
          for entry in entries:
              if not entry:
                  continue
              meta, raw_path = entry.split(b"\t", 1)
              mode, kind, oid = meta.decode().split()
              path = raw_path.decode("utf-8", errors="replace")
              if mode in ("120000", "160000"):
                  review.append({"path": path, "mode": mode})
              if path.endswith(".py") and kind == "blob":
                  data = subprocess.check_output(git + ["cat-file", "blob", oid])
                  tree = ast.parse(data, filename=path)
                  imports[path] = sorted({a.name for n in ast.walk(tree) if isinstance(n, ast.Import) for a in n.names} | {n.module or "" for n in ast.walk(tree) if isinstance(n, ast.ImportFrom)})
          report = {"source_commit": sha, "acquisition": "PASS", "pinned_file_checks": "PASS", "python_syntax": "PASS", "files": files, "python_imports": imports, "special_entries_review": review, "license_review": "PENDING", "security_review": "PENDING", "upstream_tests": "NOT_RUN", "browser_offline_test": "NOT_RUN", "execution_authorized": False, "production_admitted": False}
          (receipt / "report.json").write_text(json.dumps(report, indent=2) + "\n")
          print("Pinned source and syntax inventory verified; execution and admission remain blocked.")
          PY
      - name: Run selected original tests with no network and no writable source
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/vf-diagram-receipt"
          source="/opt/vf-diagram-${GITHUB_RUN_ID}"
          # Do not extract links or gitlinks into the runner.
          python3 - "$receipt/report.json" <<'PY'
          import json, sys
          if json.load(open(sys.argv[1]))["special_entries_review"]:
              raise SystemExit("Special tree entries require manual review")
          PY
          sudo install -d -m 0755 "$source"
          git -C "$RUNNER_TEMP/diagram-design.git" archive --format=tar "$SOURCE_SHA" | sudo tar -xf - -C "$source" --no-same-owner --no-same-permissions
          # Retain owner write mode for shutil.copy2 fixtures, while the
          # dynamic test user cannot write the root-owned source tree.
          sudo install -m 0644 fixtures/visual-factory-diagram/trama-architecture.html "$source/trama-architecture.html"
          sudo chown -R root:root "$source"
          sudo chmod -R u+rwX,go-w "$source"
          sudo chmod -R a+rX "$source"
          /usr/bin/python3 --version > "$receipt/python-version.txt"
          run_isolated() {
            sudo systemd-run --quiet --wait --pipe --collect \
              --property=DynamicUser=yes --property=PrivateNetwork=yes \
              --property=RestrictAddressFamilies=AF_UNIX --property=ProtectSystem=strict \
              --property=ProtectHome=yes --property=PrivateTmp=yes --property=PrivateDevices=yes \
              --property=NoNewPrivileges=yes --property=CapabilityBoundingSet= \
              --property=ProtectKernelTunables=yes --property=ProtectKernelModules=yes \
              --property=ProtectControlGroups=yes --property=RestrictSUIDSGID=yes \
              --property=MemoryMax=1G --property=TasksMax=64 --property=RuntimeMaxSec=90 \
              --property=WorkingDirectory="$source" \
              --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=PYTHONUTF8=1 \
              /usr/bin/python3 "$@"
          }
          # Fail closed: prove uid, network restriction and read-only source before tests.
          run_isolated -c 'import os,socket,errno; assert os.geteuid()!=0; assert not os.access(".",os.W_OK); exec("try:\n socket.socket(socket.AF_INET,socket.SOCK_STREAM)\nexcept OSError as e:\n assert e.errno in (errno.EAFNOSUPPORT,errno.EPERM,errno.EACCES),e\nelse:\n raise AssertionError(\"network socket allowed\")")' > "$receipt/isolation.log" 2>&1
          # Reproduce the exact copy2 fixture operation before upstream tests.
          run_isolated -c 'import os, pathlib, shutil, tempfile, hashlib; src=pathlib.Path("skills/diagram-design/references/style-guide.md"); original=src.read_bytes(); assert src.stat().st_uid==0; assert not os.access(src,os.W_OK); assert os.statvfs(src).f_flag & os.ST_RDONLY; d=tempfile.TemporaryDirectory(); dst=pathlib.Path(d.name)/"style-guide.md"; shutil.copy2(src,dst); assert dst.stat().st_uid==os.geteuid(); dst.write_bytes(original+b"\\nfixture-probe"); assert dst.read_bytes()!=original; assert src.read_bytes()==original; print("COPY2_FIXTURE_PASS",hashlib.sha256(original).hexdigest()); d.cleanup()' >> "$receipt/isolation.log" 2>&1
          cat "$receipt/isolation.log"
          printf 'test\tstatus\n' > "$receipt/tests.tsv"
          failed=0
          for script in test-self-check test-export-svg-standalone test-lint-a11y verify-geometry; do
            args=()
            if [ "$script" = verify-geometry ]; then args+=(--all); fi
            if run_isolated "scripts/$script.py" "${args[@]}" > "$receipt/$script.log" 2>&1; then
              printf '%s\tPASS\n' "$script" >> "$receipt/tests.tsv"
            else
              printf '%s\tFAIL\n' "$script" >> "$receipt/tests.tsv"
              tail -n 35 "$receipt/$script.log"
              failed=1
            fi
          done
          cat "$receipt/tests.tsv"
          python3 - "$receipt/report.json" "$receipt/tests.tsv" <<'PY'
          import csv, json, pathlib, sys
          report, tests = map(pathlib.Path, sys.argv[1:])
          data = json.loads(report.read_text())
          with tests.open() as stream:
              results = {r["test"]: r["status"] for r in csv.DictReader(stream, delimiter="\t")}
          data.update(isolation_probe="PASS", copy2_fixture_probe="PASS", upstream_test_results=results, upstream_tests="PASS" if len(results)==4 and all(v=="PASS" for v in results.values()) else "FAIL")
          report.write_text(json.dumps(data, indent=2)+"\n")
          PY
          test "$failed" -eq 0
          run_isolated skills/diagram-design/scripts/self_check.py --offline trama-architecture.html | tee "$receipt/pilot-self-check.log"
          run_isolated -c 'import pathlib,subprocess,sys,tempfile; d=tempfile.TemporaryDirectory(); out=pathlib.Path(d.name)/"pilot.svg"; result=subprocess.run([sys.executable,"skills/diagram-design/scripts/export_svg.py","trama-architecture.html",str(out),"--system-fonts"],capture_output=True,check=True); sys.stderr.buffer.write(result.stdout+result.stderr); sys.stdout.buffer.write(out.read_bytes()); d.cleanup()' > "$receipt/trama-architecture.svg" 2> "$receipt/pilot-export.log"
          cp fixtures/visual-factory-diagram/trama-architecture.html "$receipt/trama-architecture.html"
          python3 - "$receipt/trama-architecture.svg" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          assert root.get("role") == "img"
          for node in root.iter():
              assert node.tag.split("}")[-1] not in {"script","foreignObject","image"}
              for name,value in node.attrib.items():
                  assert not name.lower().startswith("on")
                  if name.split("}")[-1] in {"href","src"}:
                      assert value.startswith("#")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing locked browser test dependencies
        working-directory: apps/control-center
        run: npm ci --ignore-scripts
      - name: Install existing Chromium test target
        working-directory: apps/control-center
        run: npx playwright install chromium
      - name: Verify HTML and exported SVG in offline Chromium
        working-directory: apps/control-center
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { strict as assert } from 'node:assert';
          import { pathToFileURL } from 'node:url';
          import { writeFile } from 'node:fs/promises';
          const dir = process.env.RUNNER_TEMP + '/vf-diagram-receipt';
          const browser = await chromium.launch();
          const results = [];
          try {
            for (const width of [360,390,1280]) {
              for (const ext of ['html','svg']) {
                const context = await browser.newContext({ viewport: { width, height: 900 }, offline: true, javaScriptEnabled: false, reducedMotion: 'reduce' });
                try {
                  const page = await context.newPage();
                  const requests = [], errors = [];
                  page.on('request', r => { if (/^https?:/i.test(r.url())) requests.push(r.url()); });
                  page.on('pageerror', e => errors.push(String(e)));
                  const target = pathToFileURL(dir+'/trama-architecture.'+ext).href;
                  await page.goto(target);
                  const svg = page.locator('svg').first();
                  assert(await svg.isVisible());
                  assert.equal(await svg.getAttribute('role'),'img');
                  const measured = await svg.evaluate(el => {
                    const view = el.viewBox.baseVal;
                    const labels = Array.from(el.querySelectorAll('text')).map(t => {
                      const b = t.getBBox();
                      return {text:t.textContent, inBounds:b.x>=view.x-1 && b.y>=view.y-1 && b.x+b.width<=view.x+view.width+1 && b.y+b.height<=view.y+view.height+1};
                    });
                    return {width:el.getBoundingClientRect().width, scroll:document.documentElement.scrollWidth, labels, title:el.querySelector('title')?.textContent};
                  });
                  assert(measured.width>0 && measured.width<=width+1);
                  if(ext==='html') assert(measured.scroll<=width+1);
                  assert(measured.labels.length>=12 && measured.labels.every(l=>l.inBounds));
                  assert(measured.title);
                  assert.deepEqual(requests,[]);
                  assert.deepEqual(errors,[]);
                  await page.screenshot({path:dir+'/pilot-'+ext+'-'+width+'.png',fullPage:true});
                  results.push({width,ext,status:'PASS',requests,errors,measured});
                } finally { await context.close(); }
              }
            }
          } finally {
            await browser.close();
            await writeFile(dir+'/browser-results.json',JSON.stringify(results,null,2));
          }
          assert.equal(results.length,6);
          JS
      - name: Retain acquisition and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf-diagram-p0b-r2b-pilot
          path: ${{ runner.temp }}/vf-diagram-receipt/
          retention-days: 7
