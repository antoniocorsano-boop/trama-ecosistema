name: ACCESS-01 Phase 2 TDD

on:
  push:
    branches:
      - feat/access-01-phase-2-trama-access-runtime
    paths:
      - 'apps/access/**'
      - '.github/workflows/access-phase2-tdd.yml'

permissions:
  contents: write

concurrency:
  group: access-phase2-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate lockfile when absent
        id: lockfile
        working-directory: apps/access
        run: |
          if [ -f package-lock.json ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --no-audit --no-fund
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated lockfile
        if: steps.lockfile.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/access/package-lock.json
          git commit -m "chore(access): lock Phase 2 bootstrap dependencies [skip ci]"
          git push origin HEAD:feat/access-01-phase-2-trama-access-runtime

      - name: Install Access dependencies from lockfile
        working-directory: apps/access
        run: npm ci --no-audit --no-fund

      - name: Typecheck Access
        working-directory: apps/access
        run: npm run typecheck

      - name: Run config contract
        working-directory: apps/access
        run: npm test -- server/config.test.ts

      - name: Build Access
        working-directory: apps/access
        run: npm run build
