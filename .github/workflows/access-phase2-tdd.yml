name: ACCESS-01 Phase 2 TDD

on:
  push:
    branches:
      - feat/access-01-phase-2-trama-access-runtime
    paths:
      - 'apps/access/**'
      - '.github/workflows/access-phase2-tdd.yml'

permissions:
  contents: read

concurrency:
  group: access-phase2-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/gateway/package-lock.json

      - name: Install locked repository test toolchain
        working-directory: apps/gateway
        run: npm ci --no-audit --no-fund

      - name: Expose locked test toolchain at repository root
        run: ln -s apps/gateway/node_modules node_modules

      - name: Run RED config contract
        run: ./apps/gateway/node_modules/.bin/vitest run apps/access/server/config.test.ts --environment node
