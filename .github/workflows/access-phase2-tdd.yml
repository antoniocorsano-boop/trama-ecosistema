name: ACCESS-01 Phase 2 TDD

on:
  push:
    branches:
      - feat/access-01-phase-2-trama-access-runtime
    paths:
      - 'apps/access/**'
      - '.github/workflows/access-phase2-tdd.yml'

permissions:
  contents: read

concurrency:
  group: access-phase2-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated test runner
        run: |
          mkdir -p .access-tdd-runtime
          npm install --prefix .access-tdd-runtime --no-audit --no-fund vitest@5.0.2
          ln -s .access-tdd-runtime/node_modules node_modules

      - name: Run RED config contract
        run: .access-tdd-runtime/node_modules/.bin/vitest run apps/access/server/config.test.ts
