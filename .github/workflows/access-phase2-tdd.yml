name: ACCESS-01 Phase 2 TDD

on:
  push:
    branches:
      - feat/access-01-phase-2-trama-access-runtime
    paths:
      - 'apps/access/**'
      - '.github/workflows/access-phase2-tdd.yml'

permissions:
  contents: write

concurrency:
  group: access-phase2-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm resolver
        run: npm install --global npm@11.6.0

      - name: Refresh lockfile from pinned package manifest
        working-directory: apps/access
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- apps/access/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/access/package-lock.json
          git commit -m "chore(access): lock auth runtime dependencies [skip ci]"
          git push origin HEAD:feat/access-01-phase-2-trama-access-runtime

      - name: Install Access dependencies from lockfile
        working-directory: apps/access
        run: npm ci --no-audit --no-fund

      - name: Run Access unit tests
        working-directory: apps/access
        run: npm test

      - name: Typecheck Access
        working-directory: apps/access
        run: npm run typecheck

      - name: Build Access
        working-directory: apps/access
        run: npm run build
