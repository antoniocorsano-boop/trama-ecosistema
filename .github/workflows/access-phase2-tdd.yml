name: ACCESS-01 Phase 2 TDD

on:
  push:
    branches:
      - feat/access-01-phase-2-trama-access-runtime
    paths:
      - 'apps/access/**'
      - '.github/workflows/access-phase2-tdd.yml'

permissions:
  contents: read

concurrency:
  group: access-phase2-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/access/package-lock.json

      - name: Pin npm resolver
        run: npm install --global npm@11.6.0

      - name: Install Access dependencies from lockfile
        working-directory: apps/access
        run: npm ci --no-audit --no-fund

      - name: Typecheck Access
        working-directory: apps/access
        run: npm run typecheck

      - name: Run config contract
        working-directory: apps/access
        run: npm test -- server/config.test.ts

      - name: Build Access
        working-directory: apps/access
        run: npm run build
