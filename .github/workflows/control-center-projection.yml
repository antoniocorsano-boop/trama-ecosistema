name: Regenerate TRAMA Ecosystem Snapshot

on:
  pull_request:
    paths:
      - "docs/reviews/CC3-F1-HUMAN-REVIEW-2026-09-26.md"
      - "status/ecosystem-status.json"
      - "scripts/build_ecosystem_snapshot.py"
      - "scripts/build_ecosystem_snapshot_core.py"
      - ".github/workflows/control-center-projection.yml"

permissions:
  contents: read

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Regenerate governed projection in workspace
        run: python scripts/build_ecosystem_snapshot.py --output /tmp/ecosystem-snapshot.json

      - name: Validate canonical generator
        run: python scripts/build_ecosystem_snapshot.py --check

      - name: Verify committed projection is current
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path('/tmp/ecosystem-snapshot.json').read_text(encoding='utf-8'))
          committed = json.loads(Path('control-center/data/ecosystem-snapshot.json').read_text(encoding='utf-8'))
          if committed != generated:
              raise SystemExit(
                  'TRAMA_SNAPSHOT_DRIFT: regenerate control-center/data/ecosystem-snapshot.json '
                  'with scripts/build_ecosystem_snapshot.py before updating the PR head'
              )
          print('TRAMA_SNAPSHOT_PROJECTION_CURRENT')
          PY

      - name: Assert read-only CI contract
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.token }}" != ""
          echo "TRAMA_PROJECTION_CI_READ_ONLY_PASS"
