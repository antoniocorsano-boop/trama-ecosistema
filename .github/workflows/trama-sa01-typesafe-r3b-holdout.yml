name: TRAMA-SA-01 TypeSafe Pilot R3B Holdout

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modello TypeSafe da richiedere"
        required: true
        default: "jev-latest"
        type: string

permissions:
  contents: read

jobs:
  r3b-holdout:
    if: ${{ github.run_number == 1 }}
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TRAMA_R3B_HOLDOUT_AUTHORIZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require dedicated TypeSafe key
        run: test -n "$TYPESAFE_API_KEY"
      - name: Install pinned dependency
        run: python3 -m pip install -r requirements/trama-sa01-typesafe.txt
      - name: Validate preregistered R3B corpus
        run: python3 scripts/run_trama_sa01_typesafe_r3b.py --validate-only
      - name: Run R3B HOLDOUT one-shot
        run: |
          python3 scripts/run_trama_sa01_typesafe_r3b.py \
            --split HOLDOUT \
            --model "${{ inputs.model }}" \
            --output artifacts/trama-sa01-typesafe-r3b-holdout-raw.json
      - name: Upload advisory results
        uses: actions/upload-artifact@v4
        with:
          name: trama-sa01-typesafe-r3b-holdout-raw
          path: artifacts/trama-sa01-typesafe-r3b-holdout-raw.json
          if-no-files-found: error
          retention-days: 14
