name: Studio Atlas consolidation projection refresh

on:
  push:
    branches:
      - feat/studio-atlas-visual-factory-consolidated-v0.2
    paths:
      - .github/workflows/studio-atlas-consolidation-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-atlas-visual-factory-consolidated-v0.2
          fetch-depth: 0

      - name: Regenerate canonical projections
        run: |
          python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
          python scripts/build_project_context_snapshot.py --output control-center/data/project-context-snapshot.json
          python scripts/build_trama_context_pack.py project-knowledge \
            --snapshot control-center/data/project-context-snapshot.json \
            --output control-center/data/context-packs/project-knowledge.json

      - name: Restrict generated delta
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(control-center/data/ecosystem-snapshot.json|control-center/data/project-context-snapshot.json|control-center/data/context-packs/project-knowledge.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit governed projections
        run: |
          git config user.name 'trama-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add control-center/data/ecosystem-snapshot.json \
            control-center/data/project-context-snapshot.json \
            control-center/data/context-packs/project-knowledge.json
          if git diff --cached --quiet; then
            echo 'No projection delta to commit.'
            exit 0
          fi
          git commit -m 'docs: refresh projections for Studio Atlas consolidation'
          git push origin HEAD:feat/studio-atlas-visual-factory-consolidated-v0.2
