name: Audit v1.4 human review remediation

on:
  push:
    branches:
      - docs/audit-v1-4-live-visual-proof
    paths:
      - .github/workflows/audit-v1-4-human-review-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/audit-v1-4-live-visual-proof
          fetch-depth: 0

      - name: Add provenance regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_p3_status_alignment.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertTrue(any(ref.get("pullRequest") == 249 for ref in current["sourceRefs"]))\n'
          new = '''        self.assertTrue(\n            any(\n                ref.get("pullRequest") == 249\n                and ref.get("exactHead") == "6c223a4556868c0c1f14cdabd6b8f101fce6368d"\n                for ref in current["sourceRefs"]\n            )\n        )\n        audit_refs = [\n            ref\n            for ref in current["sourceRefs"]\n            if ref.get("ref") == "docs/audits/TRAMA-AUDIT-2026-10-03.md"\n        ]\n        self.assertEqual(len(audit_refs), 1)\n        self.assertEqual(audit_refs[0].get("pullRequest"), 250)\n        self.assertNotEqual(\n            audit_refs[0].get("exactHead"),\n            "290d6f3f0d15df3e8f8f438a46a26449d1247043",\n        )\n'''
          if old not in text:
              raise SystemExit('provenance test anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Confirm RED before fix
        run: |
          set +e
          python -m unittest tests.test_p3_status_alignment.P3StatusAlignmentTests.test_project_knowledge_supersedes_v13_with_current_v14_source_bound_delta -v
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Expected provenance regression test to fail before remediation' >&2
            exit 1
          fi
          echo 'RED confirmed: stale PR249 head and/or invalid Audit v1.4 source binding rejected.'

      - name: Commit RED guard
        run: |
          git config user.name 'trama-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_p3_status_alignment.py
          git commit -m 'test: guard Audit v1.4 source provenance'
          git push origin HEAD:docs/audit-v1-4-live-visual-proof

      - name: Refresh current source evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'e40054349db5ed28ea663d24f4c4d048481ba3b5'
          new = '6c223a4556868c0c1f14cdabd6b8f101fce6368d'
          for name in ['STATUS.md', 'docs/audits/TRAMA-AUDIT-2026-10-03.md']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'stale PR249 head anchor not found in {name}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git add STATUS.md docs/audits/TRAMA-AUDIT-2026-10-03.md
          git commit -m 'docs: refresh MUSEO ZERO exact-head evidence'
          git push origin HEAD:docs/audit-v1-4-live-visual-proof
          echo "AUDIT_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Repair v1.4 source binding and regenerate projections
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          events_path = Path('status/project-knowledge-events.json')
          data = json.loads(events_path.read_text(encoding='utf-8'))
          v14 = next(
              event for event in data['events']
              if event.get('eventId') == 'TRAMA-EVT-AUDIT-V1.4-VISUAL-FACTORY-LIVE-PROOF-2026-10-05'
          )
          audit_ref_seen = False
          pr249_seen = False
          for ref in v14.get('sourceRefs', []):
              if ref.get('ref') == 'docs/audits/TRAMA-AUDIT-2026-10-03.md':
                  ref['pullRequest'] = 250
                  ref['exactHead'] = os.environ['AUDIT_SOURCE_SHA']
                  audit_ref_seen = True
              if ref.get('pullRequest') == 249:
                  ref['exactHead'] = '6c223a4556868c0c1f14cdabd6b8f101fce6368d'
                  pr249_seen = True
          if not audit_ref_seen or not pr249_seen:
              raise SystemExit('required v1.4 source reference not found')
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          events_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
          python scripts/build_project_context_snapshot.py --output control-center/data/project-context-snapshot.json
          python scripts/build_trama_context_pack.py project-knowledge \
            --snapshot control-center/data/project-context-snapshot.json \
            --output control-center/data/context-packs/project-knowledge.json

      - name: Confirm GREEN
        run: |
          python -m unittest tests.test_p3_status_alignment.P3StatusAlignmentTests.test_project_knowledge_supersedes_v13_with_current_v14_source_bound_delta -v
          python -m unittest tests.test_p3_status_alignment -v

      - name: Commit governed remediation
        run: |
          git add status/project-knowledge-events.json \
            control-center/data/ecosystem-snapshot.json \
            control-center/data/project-context-snapshot.json \
            control-center/data/context-packs/project-knowledge.json
          git commit -m 'fix: bind Audit v1.4 to current governed sources'
          git push origin HEAD:docs/audit-v1-4-live-visual-proof
