name: Build TRAMA Control Center Bundle

on:
  pull_request:
    paths:
      - "control-center/**"
      - "config/**"
      - "status/**"
      - "docs/decisions/**"
      - "scripts/build_ecosystem_snapshot.py"
      - "scripts/generate_stakeholder_report.py"
      - "scripts/validate_stakeholder_assurance.py"
      - "scripts/materialize_live_project_knowledge_bundle.py"
      - "scripts/test_materialize_live_project_knowledge_bundle.py"
      - "scripts/compose_effective_project_context.py"
      - "scripts/build_control_center_render.sh"
      - "scripts/test_control_center_render_build.py"
      - "scripts/test_control_center_orientation_home.cjs"
      - "docs/evidence/trama-component-evidence-expansion-2026-09-30.md"
      - "docs/contracts/trama-component-evidence-expansion-v1.md"
      - "scripts/validate_trama_component_evidence_registry.py"
      - "scripts/test_component_evidence_expansion.py"
      - "scripts/test_component_maturity_projection.py"
      - "scripts/project_component_maturity.py"
      - "governance/ui-development/trama-component-evidence-registry-v1.json"
      - "STATUS.md"
      - "ROADMAP.md"
      - ".github/workflows/control-center-build.yml"
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "trama-control-center-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout real PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Regenerate candidate snapshot on PR head
        run: python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.generated.json
      - name: Promote only semantic changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          canonical = Path('control-center/data/ecosystem-snapshot.json')
          generated = Path('control-center/data/ecosystem-snapshot.generated.json')

          def semantic_view(snapshot):
              value = json.loads(json.dumps(snapshot))
              value.pop('generatedAt', None)
              for state in value.get('sourceState', {}).values():
                  state.pop('observedAt', None)
              for area in value.get('areas', []):
                  area.pop('lastEvaluatedAt', None)
              for evidence in value.get('evidence', []):
                  if evidence.get('type') == 'DOCUMENT_CANONICAL':
                      evidence.pop('observedAt', None)
              return value

          old = semantic_view(json.loads(canonical.read_text(encoding='utf-8'))) if canonical.exists() else None
          new = semantic_view(json.loads(generated.read_text(encoding='utf-8')))
          if old == new:
              generated.unlink()
              print('CANONICAL_SNAPSHOT_SEMANTICALLY_CURRENT')
          else:
              generated.replace(canonical)
              print('CANONICAL_SNAPSHOT_SEMANTIC_CHANGE_PROMOTED')
          PY
      - name: Commit snapshot only when semantically changed
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- control-center/data/ecosystem-snapshot.json; then
            echo "CANONICAL_SNAPSHOT_ALREADY_SYNCHRONIZED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/data/ecosystem-snapshot.json
          git commit -m "chore(control-center): synchronize canonical snapshot"
          git push origin "HEAD:${HEAD_REF}"

  build:
    needs: [synchronize]
    if: always() && (needs.synchronize.result == 'success' || needs.synchronize.result == 'skipped')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synchronized state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.sha }}
          fetch-depth: 1
      - name: Regenerate governed snapshot
        run: python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.generated.json
      - name: Preserve generated snapshot evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trama-generated-canonical-snapshot
          path: control-center/data/ecosystem-snapshot.generated.json
          if-no-files-found: error
          retention-days: 3
      - name: Validate canonical snapshot parity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          canonical = Path('control-center/data/ecosystem-snapshot.json')
          generated = Path('control-center/data/ecosystem-snapshot.generated.json')
          if not canonical.exists():
              raise SystemExit('CANONICAL_SNAPSHOT_MISSING')
          def semantic_view(snapshot):
              value = json.loads(json.dumps(snapshot))
              value.pop('generatedAt', None)
              for state in value.get('sourceState', {}).values(): state.pop('observedAt', None)
              for area in value.get('areas', []): area.pop('lastEvaluatedAt', None)
              for evidence in value.get('evidence', []):
                  if evidence.get('type') == 'DOCUMENT_CANONICAL': evidence.pop('observedAt', None)
              return value
          old = semantic_view(json.loads(canonical.read_text(encoding='utf-8')))
          new = semantic_view(json.loads(generated.read_text(encoding='utf-8')))
          if old != new:
              raise SystemExit('CANONICAL_SNAPSHOT_STALE')
          print('CANONICAL_SNAPSHOT_PARITY_PASS')
          PY
      - name: Promote generated snapshot for bundle
        run: mv control-center/data/ecosystem-snapshot.generated.json control-center/data/ecosystem-snapshot.json
      - name: Qualify live Project Knowledge bundle materialization
        if: github.event_name == 'pull_request'
        run: python scripts/test_materialize_live_project_knowledge_bundle.py

      - name: Materialize live read-only Project Knowledge for deploy bundle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet jsonschema
          live_overlay=/tmp/trama-live-repository-overlay.json

          if python scripts/run_live_repository_overlay.py --pretty > "$live_overlay"; then
            python scripts/materialize_live_project_knowledge_bundle.py \
              --overlay "$live_overlay" \
              --output control-center/data/context-packs/project-knowledge.json
            rm -f "$live_overlay"
            echo "TRAMA_LIVE_EFFECTIVE_CONTEXT_BUNDLE_PASS"
          else
            rm -f "$live_overlay"
            python scripts/build_trama_context_pack.py project-knowledge \
              --output control-center/data/context-packs/project-knowledge.json
            echo "TRAMA_LIVE_EFFECTIVE_CONTEXT_UNAVAILABLE_GOVERNED_FALLBACK"
          fi

      - name: Regenerate stakeholder dossier
        run: python scripts/generate_stakeholder_report.py
      - name: Verify bundle and machine contract
        shell: bash
        run: |
          set -euo pipefail
          test -s control-center/data/ecosystem-snapshot.json
          test -s control-center/data/context-packs/project-knowledge.json
          test -s control-center/project-knowledge-state.js
          grep -q "Stato delle informazioni" control-center/index.html
          node scripts/test_stage_e2_project_knowledge_ui.cjs
          node scripts/test_stage_e3_public_validation_surface.cjs
          node scripts/test_component_maturity_ui.cjs
          node scripts/test_control_center_orientation_home.cjs
          python scripts/test_control_center_render_build.py
          test -s control-center/e3/index.html
          test -s control-center/maturity.html
          test -s control-center/evidence.html
          test -s control-center/operations.html
          grep -q '"integrityChecks"' control-center/data/ecosystem-snapshot.json
          grep -q '"operationalPath"' control-center/data/ecosystem-snapshot.json
          grep -q '"timelineEvents"' control-center/data/ecosystem-snapshot.json
          grep -q '"timelineCoverage"' control-center/data/ecosystem-snapshot.json
          grep -q '"components"' control-center/data/ecosystem-snapshot.json
          test -s control-center/component-maturity.js
          grep -q "Cronologia governata" control-center/operations.html
          grep -q "Evidence Explorer" control-center/evidence.html
          test -s control-center/reports/stakeholder-assurance.html
          test -s control-center/reports/stakeholder-assurance.md
          grep -q "Dossier Stakeholder Assurance" control-center/reports/stakeholder-assurance.html
          grep -q "Non costituisce certificazione" control-center/reports/stakeholder-assurance.html
          python scripts/build_ecosystem_snapshot.py --check
      - name: Package deployable Control Center
        uses: actions/upload-artifact@v4
        with:
          name: trama-control-center-bundle
          path: control-center/
          if-no-files-found: error
          retention-days: 14
