name: Build TRAMA Control Center Bundle

on:
  pull_request:
    paths:
      - "control-center/**"
      - "config/**"
      - "status/**"
      - "docs/decisions/**"
      - "scripts/build_ecosystem_snapshot.py"
      - "scripts/generate_stakeholder_report.py"
      - "scripts/validate_stakeholder_assurance.py"
      - "STATUS.md"
      - "ROADMAP.md"
      - ".github/workflows/control-center-build.yml"
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "trama-control-center-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Regenerate governed snapshot
        run: python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.generated.json
      - name: Preserve generated snapshot evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trama-generated-canonical-snapshot
          path: control-center/data/ecosystem-snapshot.generated.json
          if-no-files-found: error
          retention-days: 3
      - name: Validate canonical snapshot parity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          canonical = Path('control-center/data/ecosystem-snapshot.json')
          generated = Path('control-center/data/ecosystem-snapshot.generated.json')
          if not canonical.exists():
              raise SystemExit('CANONICAL_SNAPSHOT_MISSING')

          def semantic_view(snapshot):
              value = json.loads(json.dumps(snapshot))
              value.pop('generatedAt', None)
              for state in value.get('sourceState', {}).values():
                  state.pop('observedAt', None)
              for area in value.get('areas', []):
                  area.pop('lastEvaluatedAt', None)
              for evidence in value.get('evidence', []):
                  if evidence.get('type') == 'DOCUMENT_CANONICAL':
                      evidence.pop('observedAt', None)
              return value

          old = semantic_view(json.loads(canonical.read_text(encoding='utf-8')))
          new = semantic_view(json.loads(generated.read_text(encoding='utf-8')))
          if old != new:
              raise SystemExit('CANONICAL_SNAPSHOT_STALE: use the preserved generated artifact to update the PR; validation never writes')
          print('CANONICAL_SNAPSHOT_PARITY_PASS')
          PY
      - name: Promote generated snapshot for bundle
        shell: bash
        run: mv control-center/data/ecosystem-snapshot.generated.json control-center/data/ecosystem-snapshot.json
      - name: Regenerate stakeholder dossier
        run: python scripts/generate_stakeholder_report.py
      - name: Verify bundle and machine contract
        shell: bash
        run: |
          set -euo pipefail
          test -s control-center/data/ecosystem-snapshot.json
          test -s control-center/evidence.html
          test -s control-center/operations.html
          grep -q '"integrityChecks"' control-center/data/ecosystem-snapshot.json
          grep -q '"operationalPath"' control-center/data/ecosystem-snapshot.json
          grep -q '"timelineEvents"' control-center/data/ecosystem-snapshot.json
          grep -q '"timelineCoverage"' control-center/data/ecosystem-snapshot.json
          grep -q "Cronologia governata" control-center/operations.html
          grep -q "Evidence Explorer" control-center/evidence.html
          test -s control-center/reports/stakeholder-assurance.html
          test -s control-center/reports/stakeholder-assurance.md
          grep -q "Dossier Stakeholder Assurance" control-center/reports/stakeholder-assurance.html
          grep -q "Non costituisce certificazione" control-center/reports/stakeholder-assurance.html
          python scripts/build_ecosystem_snapshot.py --check
      - name: Package deployable Control Center
        uses: actions/upload-artifact@v4
        with:
          name: trama-control-center-bundle
          path: control-center/
          if-no-files-found: error
          retention-days: 14
