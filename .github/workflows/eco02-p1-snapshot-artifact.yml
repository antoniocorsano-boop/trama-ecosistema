name: ECO-02 P1 Snapshot Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/eco02-p1-snapshot-artifact.yml"
      - "scripts/build_ecosystem_snapshot.py"
      - "status/ecosystem-status.json"
      - "status/governed-events.json"
      - "docs/decisions/decision-register.json"
      - "STATUS.md"
      - "ROADMAP.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Generate canonical ecosystem snapshot
        run: python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
      - name: Commit canonical snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- control-center/data/ecosystem-snapshot.json; then
            echo "Canonical snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/data/ecosystem-snapshot.json
          git commit -m "chore: regenerate canonical ecosystem snapshot"
          git push origin HEAD:${{ github.head_ref }}
