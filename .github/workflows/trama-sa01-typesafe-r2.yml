name: TRAMA-SA-01 TypeSafe Pilot R2

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modello TypeSafe da richiedere"
        required: true
        default: "jev-latest"
        type: string

permissions:
  contents: read

jobs:
  pilot-r2:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require dedicated TypeSafe key
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "TYPESAFE_API_KEY is not configured for TRAMA-SA-01/R2."
            exit 2
          fi

      - name: Install pinned pilot dependency
        run: python3 -m pip install -r requirements/trama-sa01-typesafe.txt

      - name: Validate synthetic corpus
        run: python3 scripts/run_trama_sa01.py validate

      - name: Run TypeSafe semantic pilot R2
        run: |
          python3 scripts/run_trama_sa01_typesafe_r2.py \
            --model "${{ inputs.model }}" \
            --output artifacts/trama-sa01-typesafe-r2-raw.json

      - name: Upload raw advisory results
        uses: actions/upload-artifact@v4
        with:
          name: trama-sa01-typesafe-r2-raw
          path: artifacts/trama-sa01-typesafe-r2-raw.json
          if-no-files-found: error
          retention-days: 14
