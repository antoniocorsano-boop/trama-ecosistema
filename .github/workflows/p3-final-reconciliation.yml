name: P3 Final Reconciliation

on:
  push:
    branches:
      - docs/p3-final-reconciliation
    paths:
      - scripts/reconcile_p3_final.py
      - .github/workflows/p3-final-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: docs/p3-final-reconciliation
          fetch-depth: 0
      - name: Apply idempotent P3 reconciliation
        run: python3 scripts/reconcile_p3_final.py
      - name: Commit source reconciliation only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- STATUS.md docs/audits/TRAMA-AUDIT-2026-10-03.md status/project-knowledge-events.json; then
            echo "P3_SOURCE_ALREADY_RECONCILED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md docs/audits/TRAMA-AUDIT-2026-10-03.md status/project-knowledge-events.json
          git commit -m "docs(p3): reconcile final status and evidence"
          git push origin HEAD:docs/p3-final-reconciliation
