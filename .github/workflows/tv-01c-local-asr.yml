name: TV-01C Synthetic Local ASR
on:
  pull_request:
    paths:
      - 'experiments/tv-01c/**'
      - '.github/workflows/tv-01c-local-asr.yml'
      - 'docs/capabilities/voice-interaction/TV-01C-LOCAL-ENGINE-EVALUATION-v1.md'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Harness self-test
        run: python3 experiments/tv-01c/benchmark.py --selftest
      - name: Acquire public dependencies and model (no user data)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg unzip
          python3 -m venv .tv01c-venv
          .tv01c-venv/bin/pip install --disable-pip-version-check vosk==0.3.45
          mkdir -p .tv01c-model
          curl --fail --location --retry 2 --max-time 90 https://alphacephei.com/vosk/models/vosk-model-small-it-0.22.zip -o .tv01c-model/model.zip
          sha256sum .tv01c-model/model.zip
          unzip -q .tv01c-model/model.zip -d .tv01c-model
      - name: Local inference in isolated network namespace
        run: |
          mkdir -p .tv01c-evidence
          sudo unshare --net --mount --propagation private -- sh -c 'mount -t sysfs sysfs /sys && exec setpriv --reuid="$1" --regid="$2" --clear-groups "$3" "$4" --model "$5" --model-archive "$6" --output "$7"' sh "$(id -u)" "$(id -g)" "$PWD/.tv01c-venv/bin/python" "$PWD/experiments/tv-01c/benchmark.py" "$PWD/.tv01c-model/vosk-model-small-it-0.22" "$PWD/.tv01c-model/model.zip" "$PWD/.tv01c-evidence/report.json"
      - name: Preserve synthetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv01c-synthetic-asr-report
          path: .tv01c-evidence/report.json
          if-no-files-found: error
          retention-days: 7
