name: Visual Factory — Provider Discovery v0.1

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/visual-factory-provider-discovery.yml"
      - "scripts/probe_azure_credit_entitlement.py"
      - "scripts/probe_owned_k8s_entitlement.py"
      - "docs/capabilities/atlas-percorsi/production/PROVIDER-QUALIFICATION-MATRIX-v0.1.md"

permissions:
  contents: read

jobs:
  contract:
    name: Validate provider discovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate probe scripts compile
        run: |
          python -m py_compile scripts/probe_azure_credit_entitlement.py
          python -m py_compile scripts/probe_owned_k8s_entitlement.py

      - name: Confirm read-only contract
        run: |
          ! grep -R "az vm create\|kubectl apply\|kubectl create\|sky launch" \
            scripts/probe_azure_credit_entitlement.py \
            scripts/probe_owned_k8s_entitlement.py

  discover:
    name: Read-only provider discovery
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'vf-provider-probe'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_BILLING_ACCOUNT_ID: ${{ vars.AZURE_BILLING_ACCOUNT_ID }}
      AZURE_BILLING_PROFILE_ID: ${{ vars.AZURE_BILLING_PROFILE_ID }}
      KUBECONFIG_B64: ${{ secrets.TRAMA_KUBECONFIG_B64 }}
      K8S_CONTEXT: ${{ vars.TRAMA_K8S_CONTEXT }}
      K8S_ZERO_MARGINAL: ${{ vars.TRAMA_K8S_ZERO_MARGINAL_AUTHORIZED }}
      K8S_ESTIMATED_RUNS: ${{ vars.TRAMA_K8S_ESTIMATED_RUNS_REMAINING }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p /tmp/provider-discovery

      - name: Probe Azure configuration
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/provider-discovery/azure.json

          if [[ -z "${AZURE_CREDENTIALS_JSON:-}" || -z "${AZURE_BILLING_ACCOUNT_ID:-}" || -z "${AZURE_BILLING_PROFILE_ID:-}" ]]; then
            python -c 'import json; print(json.dumps({"schemaVersion":"trama.compute-entitlement-adapter-evidence/v0.1","adapter":"azure-credit/v0.1","readOnly":True,"decision":"NOT_CONFIGURED","reason":"REQUIRED_GITHUB_SECRET_OR_VARIABLE_MISSING"}, indent=2))' > "$OUT"
            cat "$OUT"
            exit 0
          fi

          python -m pip install -q azure-cli
          python -c 'import json,os,subprocess; c=json.loads(os.environ["AZURE_CREDENTIALS_JSON"]); subprocess.run(["az","login","--service-principal","--username",c["clientId"],"--password",c["clientSecret"],"--tenant",c["tenantId"],"--output","none"],check=True); sid=c.get("subscriptionId"); subprocess.run(["az","account","set","--subscription",sid],check=True) if sid else None'

          python scripts/probe_azure_credit_entitlement.py \
            --billing-account-id "$AZURE_BILLING_ACCOUNT_ID" \
            --billing-profile-id "$AZURE_BILLING_PROFILE_ID" \
            --run-cost-upper-bound-usd 2.0 \
            --system-ram-gib 24 \
            --disk-free-gib 80 \
            --accelerator L4 \
            --vram-gib 24 \
            --output "$OUT"

      - name: Probe owned Kubernetes configuration
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/provider-discovery/kubernetes.json

          if [[ -z "${KUBECONFIG_B64:-}" || "${K8S_ZERO_MARGINAL:-}" != "true" ]]; then
            python -c 'import json; print(json.dumps({"schemaVersion":"trama.compute-entitlement-adapter-evidence/v0.1","adapter":"owned-kubernetes/v0.1","readOnly":True,"decision":"NOT_CONFIGURED","reason":"KUBECONFIG_OR_ZERO_MARGINAL_AUTHORIZATION_MISSING"}, indent=2))' > "$OUT"
            cat "$OUT"
            exit 0
          fi

          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          RUNS="${K8S_ESTIMATED_RUNS:-0}"
          python scripts/probe_owned_k8s_entitlement.py \
            --context "${K8S_CONTEXT:-}" \
            --zero-marginal-authorized \
            --accelerator-name T4 \
            --vram-gib 16 \
            --system-ram-gib 24 \
            --disk-free-gib 80 \
            --estimated-runs-remaining "$RUNS" \
            --output "$OUT"

      - name: Build discovery summary
        shell: bash
        run: |
          python -c 'import json; from pathlib import Path; names=("azure","kubernetes"); providers={n:json.loads(Path(f"/tmp/provider-discovery/{n}.json").read_text()) for n in names if Path(f"/tmp/provider-discovery/{n}.json").exists()}; result={"schemaVersion":"trama.provider-discovery/v0.1","readOnly":True,"computeProvisioned":False,"providers":{n:{"decision":d.get("decision"),"reason":d.get("reason")} for n,d in providers.items()}}; Path("/tmp/provider-discovery/summary.json").write_text(json.dumps(result,indent=2)+"\n"); print(json.dumps(result,indent=2))'

          echo "### Visual Factory provider discovery" >> "$GITHUB_STEP_SUMMARY"
          echo "- read-only: true" >> "$GITHUB_STEP_SUMMARY"
          echo "- compute provisioned: false" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/provider-discovery/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-factory-provider-discovery
          path: /tmp/provider-discovery
          if-no-files-found: warn
          retention-days: 14
