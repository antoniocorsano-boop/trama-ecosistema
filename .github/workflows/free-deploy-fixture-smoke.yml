name: FREE-DEPLOY — Synthetic static verification
on:
  pull_request:
    paths:
      - scripts/free_deploy_fixture.py
      - tests/test_free_deploy_fixture.py
      - .github/workflows/free-deploy-fixture-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test fail-closed fixture contract
        run: python3 -m unittest discover -s tests -p test_free_deploy_fixture.py -v
      - name: Read-only verification of existing synthetic public site
        run: python3 scripts/free_deploy_fixture.py verify-live
# No secrets, deploy, credentials, provider changes or student authorization.
