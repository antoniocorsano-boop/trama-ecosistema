name: AF-09 - Missione 118 V7 Nicola alternative
on:
  pull_request:
    types: [labeled, synchronize]
    branches: [feat/audio-factory-af01-kokoro-pilot]
permissions:
  contents: read
concurrency:
  group: af09-v7-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  candidate:
    if: >-
      github.event.action == 'labeled' &&
      github.event.repository.private == false &&
      github.event.pull_request.number == 304 &&
      github.event.label.name == 'af09-v7-nicola-autorizzato' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/audio-factory-af03-qwen3-prosody' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline tests
        run: python -m unittest discover -s services/audio-factory/tests -p 'test_*.py' -q
      - name: Install previously qualified CPU synthesis dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --retries 1 --timeout 20 --only-binary=:all: -r services/audio-factory/requirements-kokoro.txt
      - name: Italian phonemizer preflight
        run: |
          python - <<'PY'
          from misaki import espeak
          p,_=espeak.EspeakG2P(language="it")("La città è intelligente.")
          assert p.strip()
          PY
      - name: Generate five scenes by sentence with controlled pauses
        timeout-minutes: 12
        run: python services/audio-factory/af09_v7_nicola.py --output af09-v7
      - name: Install independent CPU ASR
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --retries 0 "faster-whisper==1.2.1" "ctranslate2==4.9.0"
      - name: Blind lexical review
        timeout-minutes: 6
        run: python services/audio-factory/af09_v7_nicola.py --output af09-v7 --asr
      - name: Preserve every segment and all receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af09-missione118-v7-nicola
          path: af09-v7/
          if-no-files-found: warn
          retention-days: 7
