name: Temporary DOS-M4 Finalization

on:
  push:
    branches:
      - chore/dos-m4-01-runtime-canary
    paths:
      - 'scripts/tmp_dos_m4_finalize.py'
      - '.github/workflows/tmp-dos-m4-finalize.yml'

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --quiet jsonschema

      - name: Generate DOS-M4 workflow finalization
        run: python scripts/tmp_dos_m4_finalize.py

      - name: Validate maturity evidence registry
        run: python scripts/validate_maturity_evidence_registry.py

      - name: Validate maturity evidence binding
        run: python scripts/test_maturity_evidence_binding.py

      - name: Validate maturity reconciliation
        run: python scripts/test_maturity_reconciliation.py

      - name: Validate generated ecosystem snapshot
        run: python scripts/build_ecosystem_snapshot.py --check

      - name: Verify canonical snapshot semantics are stable
        shell: bash
        run: |
          cp control-center/data/ecosystem-snapshot.json /tmp/first.json
          python scripts/build_ecosystem_snapshot.py --output /tmp/second.json
          python - <<'PY'
          import json
          from pathlib import Path

          first=json.loads(Path('/tmp/first.json').read_text(encoding='utf-8'))
          second=json.loads(Path('/tmp/second.json').read_text(encoding='utf-8'))

          for source_id, source in second['sourceState'].items():
              assert source_id in first['sourceState'], source_id
              assert first['sourceState'][source_id].get('sha256') == source.get('sha256'), source_id

          def semantic_area(item):
              return {k:v for k,v in item.items() if k != 'lastEvaluatedAt'}

          assert [semantic_area(x) for x in first['areas']] == [semantic_area(x) for x in second['areas']]
          for key in ('capabilities','components','gates','dependencies','expansionCandidates','integrityChecks','operationalPath','timelineEvents','timelineCoverage'):
              assert first[key] == second[key], key

          print('DOS_M4_SNAPSHOT_CANONICAL_SEMANTICS_PASS')
          PY

      - name: Stage validated canonical workflow as ordinary blob
        shell: bash
        run: |
          mkdir -p tmp/dos-m4-finalization
          cp .github/workflows/control-center-snapshot.yml tmp/dos-m4-finalization/control-center-snapshot.validated.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/dos-m4-finalization/control-center-snapshot.validated.yml
          git diff --cached --check
          git commit -m 'DOS-M4-01: stage validated Control Center workflow blob'
          git push origin HEAD:chore/dos-m4-01-runtime-canary
