name: VF-ORCH-01 governed status reconciliation

on:
  push:
    branches:
      - feat/studio-atlas-visual-factory-consolidated-v0.2
    paths:
      - .github/workflows/vf-orch-status-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-atlas-visual-factory-consolidated-v0.2
          fetch-depth: 0

      - name: Reconcile current governed status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path('STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          old = '- **VF-ORCH-01:** `CORE_IMPLEMENTED / PLAN_INCOMPLETE`;'
          new = '- **VF-ORCH-01:** `DETERMINISTIC_QUALIFICATION_PASS / LIVE_ZERO_COST_EXECUTION_NOT_YET_PROVEN`; runner condiviso, modalità manuali `dry-run | references | shots`, test/typecheck/build e contratti provider sono qualificati; nessun live inference è ancora attestato;'
          if old not in status:
              raise SystemExit('VF-ORCH-01 status anchor not found')
          status = status.replace(old, new, 1)
          old_sequence = 'Sequenza canonica: baseline v1.3 → consolidamento PR sovrapposte → chiusura bounded VF-ORCH-01 → primo run visuale reale governato → Human Visual Review/reference lock → F1–F6 + MUSEO ZERO v0.2 → Human Product Review `PASS/REWORK/REJECT` → S5 → S6. P4/P5 restano lane indipendenti. `DOS-A1=RUNTIME_DEFERRED`.'
          new_sequence = 'Sequenza canonica: baseline v1.3 → consolidamento Studio Atlas/Visual Factory + qualifica deterministica VF-ORCH-01 → primo run visuale reale governato → Human Visual Review/reference lock → F1–F6 + MUSEO ZERO v0.2 → Human Product Review `PASS/REWORK/REJECT` → S5 → S6. P4/P5 restano lane indipendenti. `DOS-A1=RUNTIME_DEFERRED`.'
          if old_sequence not in status:
              raise SystemExit('canonical sequence anchor not found')
          status = status.replace(old_sequence, new_sequence, 1)
          status_path.write_text(status, encoding='utf-8')

          events_path = Path('status/project-knowledge-events.json')
          data = json.loads(events_path.read_text(encoding='utf-8'))
          event_id = 'TRAMA-EVT-VF-ORCH-01-DETERMINISTIC-QUALIFICATION-2026-10-05'
          if not any(event.get('eventId') == event_id for event in data['events']):
              data['events'].append({
                  'eventId': event_id,
                  'type': 'BASELINE',
                  'subject': 'visual-factory',
                  'statement': 'VF-ORCH-01 has deterministic qualification PASS for its bounded FREE_ONLY orchestration surface, shared runner and manual dry-run/references/shots modes; live zero-cost provider inference is not yet proven and no runtime, publication, learner or student authority is granted.',
                  'status': 'CURRENT',
                  'rationale': 'project-knowledge projection of the post-Audit-v1.3 VF-ORCH-01 closeout: implementation qualification is distinct from the still-pending real governed visual run.',
                  'sourceRefs': [
                      {
                          'repository': 'antoniocorsano-boop/trama-ecosistema',
                          'exactHead': '48750cda9d7073df374d1263142d233135a0b045',
                          'ref': 'docs/capabilities/atlas-percorsi/production/VF-ORCH-01-QUALIFICATION-RECEIPT-v0.1.md'
                      },
                      {
                          'repository': 'antoniocorsano-boop/trama-ecosistema',
                          'ref': 'docs/superpowers/plans/2026-10-05-vf-orch-01-zero-cost-multiprovider.md'
                      },
                      {
                          'repository': 'antoniocorsano-boop/trama-ecosistema',
                          'ref': 'STATUS.md'
                      }
                  ],
                  'validFrom': '2026-10-05T12:38:00Z',
                  'supersedes': [],
                  'invalidatedBy': [],
                  'freshness': {'policy': 'UNTIL_CHANGE'}
              })
          data['updatedAt'] = '2026-10-05T12:38:00Z'
          events_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical projections
        run: |
          python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
          python scripts/build_project_context_snapshot.py --output control-center/data/project-context-snapshot.json
          python scripts/build_trama_context_pack.py project-knowledge \
            --snapshot control-center/data/project-context-snapshot.json \
            --output control-center/data/context-packs/project-knowledge.json

      - name: Restrict governed delta
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(STATUS.md|status/project-knowledge-events.json|control-center/data/ecosystem-snapshot.json|control-center/data/project-context-snapshot.json|control-center/data/context-packs/project-knowledge.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit governed status delta
        run: |
          git config user.name 'trama-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add STATUS.md status/project-knowledge-events.json \
            control-center/data/ecosystem-snapshot.json \
            control-center/data/project-context-snapshot.json \
            control-center/data/context-packs/project-knowledge.json
          git commit -m 'docs: record VF-ORCH-01 deterministic qualification'
          git push origin HEAD:feat/studio-atlas-visual-factory-consolidated-v0.2
