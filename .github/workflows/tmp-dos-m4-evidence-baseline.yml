name: Temporary DOS-M4 Evidence Baseline Refresh

on:
  push:
    branches:
      - chore/dos-m4-01-runtime-canary
    paths:
      - '.github/workflows/tmp-dos-m4-evidence-baseline.yml'

permissions:
  contents: write

jobs:
  refresh-evidence-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json

      - name: Install dependencies
        working-directory: apps/control-center
        run: npm ci --ignore-scripts

      - name: Build candidate
        working-directory: apps/control-center
        run: npm run build

      - name: Install Chromium
        working-directory: apps/control-center
        run: npx playwright install --with-deps chromium

      - name: Refresh only Evidence visual baselines
        working-directory: apps/control-center
        run: npx playwright test e2e/a6-visual.spec.ts -g "visual parity: evidence" --update-snapshots

      - name: Commit refreshed Evidence baselines
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-center/e2e/a6-visual.spec.ts-snapshots/evidence-*-linux.png
          git diff --cached --exit-code && { echo 'No baseline changes produced'; exit 1; } || true
          git commit -m 'test(control-center): refresh Evidence visual baselines for DOS-M4'
          git push origin HEAD:chore/dos-m4-01-runtime-canary
