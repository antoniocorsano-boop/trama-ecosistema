name: Visual Factory — HF ZeroGPU Probe

on:
  pull_request:
    paths:
      - ".github/workflows/visual-factory-hf-zero-gpu-probe.yml"
      - "scripts/deploy_visual_factory_hf_space.py"
      - "services/visual-factory-hf/**"

permissions:
  contents: read

jobs:
  probe:
    name: Deploy only when FREE_ONLY HF token is configured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current Hugging Face Hub client
        run: pip install "huggingface_hub>=2.1.1"

      - name: Probe or deploy configured private ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VISUAL_FACTORY_SPACE_REPO: ${{ vars.HF_VISUAL_FACTORY_SPACE_REPO }}
        run: |
          set -euo pipefail
          python scripts/deploy_visual_factory_hf_space.py | tee /tmp/hf-zero-gpu-probe.txt
          {
            echo "## HF ZeroGPU probe"
            echo '```text'
            cat /tmp/hf-zero-gpu-probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: FREE_ONLY authority boundary
        run: |
          grep -q 'ZERO_GPU_FLAVOR = "zero-a10g"' scripts/deploy_visual_factory_hf_space.py
          ! grep -Ei 't4-|l4|l40|a10g-small|a10g-large|a100|h100|purchase|paid.fallback' scripts/deploy_visual_factory_hf_space.py
