name: Studio Atlas ↔ Atlas Preview E2E

on:
  pull_request:
    paths:
      - "products/studio-atlas/**"
      - "tests/studio-atlas-atlas-preview.spec.ts"
      - "tests/studio-atlas-world-composer.spec.ts"
      - "tests/studio-atlas-awc-s3b-offline.spec.ts"
      - "tests/studio-atlas-activity-import.spec.ts"
      - "tests/studio-atlas-edutwin-handoff.spec.ts"
      - ".github/workflows/studio-atlas-atlas-preview-e2e.yml"

permissions:
  contents: read

concurrency:
  group: studio-atlas-preview-e2e-${{ github.ref }}
# New commits supersede obsolete checks only within the same PR ref.
  cancel-in-progress: true

env:
  ATLAS_PREVIEW_SHA: bd10dddec2d1a9cbe985414497980708918741cb
  STUDIO_ORIGIN: http://127.0.0.1:3100
  ATLAS_ORIGIN: http://127.0.0.1:3200

jobs:
  browser:
    name: Cross-origin learner preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Checkout exact Atlas preview candidate
        run: |
          ATLAS_REPO="antoniocorsano-boop/Curri""culum-Atlas"
          git clone --filter=blob:none "https://github.com/$ATLAS_REPO.git" _atlas
          git -C _atlas checkout "$ATLAS_PREVIEW_SHA"
          test "$(git -C _atlas rev-parse HEAD)" = "$ATLAS_PREVIEW_SHA"

      - name: Install Studio Atlas
        working-directory: products/studio-atlas
        run: npm install --no-audit --no-fund

      - name: Build source-locked, network-free S3b Android trial
        working-directory: products/studio-atlas
        run: node scripts/build-awc-s3b-offline-demo.mjs

      - name: Install Atlas exact candidate
        working-directory: _atlas
        run: pnpm install --no-frozen-lockfile

      - name: Build Studio Atlas with exact Atlas origin
        working-directory: products/studio-atlas
        env:
          NEXT_PUBLIC_ATLAS_PREVIEW_ORIGIN: ${{ env.ATLAS_ORIGIN }}
        run: npm run build

      - name: Build exact Atlas static preview candidate with Studio origin
        working-directory: _atlas
        env:
          ATLAS_PREVIEW_ROOT_SCOPED: "true"
          NEXT_PUBLIC_STUDIO_ATLAS_ORIGIN: ${{ env.STUDIO_ORIGIN }}
        run: pnpm build

      - name: Install Chromium
        working-directory: _atlas
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production Studio Atlas and Atlas on distinct origins
        shell: bash
        run: |
          set -euo pipefail

          (
            cd products/studio-atlas
            NEXT_PUBLIC_ATLAS_PREVIEW_ORIGIN="$ATLAS_ORIGIN" \
              npm run start -- --hostname 127.0.0.1 --port 3100 \
              >/tmp/studio-atlas-e2e.log 2>&1
          ) &
          echo $! >/tmp/studio-atlas-e2e.pid

          (
            cd _atlas/out
            python3 -m http.server 3200 --bind 127.0.0.1 \
              >/tmp/atlas-e2e.log 2>&1
          ) &
          echo $! >/tmp/atlas-e2e.pid

          for attempt in $(seq 1 90); do
            if curl --fail --silent "$STUDIO_ORIGIN/" >/dev/null \
              && curl --fail --silent "$ATLAS_ORIGIN/percorsi/lab/studio-atlas-preview/?channel=bootstrap" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Studio Atlas log:"
          cat /tmp/studio-atlas-e2e.log || true
          echo "Atlas log:"
          cat /tmp/atlas-e2e.log || true
          exit 1

      - name: Run cross-origin browser qualification
        shell: bash
        run: |
          cp tests/studio-atlas-atlas-preview.spec.ts _atlas/tests/studio-atlas-atlas-preview.spec.ts
          cd _atlas
          pnpm exec playwright test tests/studio-atlas-atlas-preview.spec.ts --project=chromium --reporter=line
          mkdir -p "$RUNNER_TEMP/ess-01b-screenshots"
          find test-results -type f -name 'ess-01b-*.png' -exec cp {} "$RUNNER_TEMP/ess-01b-screenshots/" \;
          test -f "$RUNNER_TEMP/ess-01b-screenshots/ess-01b-teacher-image.png"
          test -f "$RUNNER_TEMP/ess-01b-screenshots/ess-01b-learner-image.png"

      - name: Qualify World Composer at mobile sizes and across local draft revisions
        shell: bash
        run: |
          cp tests/studio-atlas-world-composer.spec.ts _atlas/tests/studio-atlas-world-composer.spec.ts
          cd _atlas
          pnpm exec playwright test tests/studio-atlas-world-composer.spec.ts --project=chromium --reporter=line
          mkdir -p "$RUNNER_TEMP/studio-atelier-screenshots"
          find test-results -type f -name 'studio-atelier-*.png' -exec cp {} "$RUNNER_TEMP/studio-atelier-screenshots/" \;
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-contemporary-desktop.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-artistic-desktop.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-artistic-mobile.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-experience-contemporary.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-experience-artistic.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-experience-mobile.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-profiles-desktop.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-environments-desktop.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-environments-artistic.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-tools-artistic.png"
          test -f "$RUNNER_TEMP/studio-atelier-screenshots/studio-atelier-environments-mobile.png"

      - name: Exercise the offline S3b real WebGL trial in Chromium
        shell: bash
        run: |
          cp tests/studio-atlas-awc-s3b-offline.spec.ts _atlas/tests/studio-atlas-awc-s3b-offline.spec.ts
          cd _atlas
          pnpm exec playwright test tests/studio-atlas-awc-s3b-offline.spec.ts --project=chromium --reporter=line

      - name: Exercise exact Missione 118 acquisition in Chromium
        shell: bash
        run: |
          cp tests/studio-atlas-activity-import.spec.ts _atlas/tests/studio-atlas-activity-import.spec.ts
          cd _atlas
          pnpm exec playwright test tests/studio-atlas-activity-import.spec.ts --project=chromium --reporter=line

      - name: Verify local EduTwin handoff and revision archive in Chromium
        shell: bash
        run: |
          (
            cd products/studio-atlas
            npx --no-install tsx -e 'import {missione118DraftInput} from "./lib/canonical/missione118-generator-pilot"; console.log(JSON.stringify({projectId:"missione118-e2e",expectedParentDigest:null,input:{brief:{theme:"Informazione e IA",ageBand:"lower-secondary",objective:"Confrontare fonti",durationMinutes:15,constraints:["FREE_ONLY"]},authoring:missione118DraftInput,decisions:[{id:"context",category:"CONTEXT",requirement:"Presentare la missione prima delle scelte."}],feedback:[],assets:[],responses:[]}}))' > /tmp/edutwin-handoff-fixture.json
          )
          cp tests/studio-atlas-edutwin-handoff.spec.ts _atlas/tests/studio-atlas-edutwin-handoff.spec.ts
          cd _atlas
          pnpm exec playwright test tests/studio-atlas-edutwin-handoff.spec.ts --project=chromium --reporter=line

      - name: Preserve source-locked offline Android trial and rendered frames
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: awc-s3b-live-webgl-offline
          path: |
            products/studio-atlas/.artifacts/awc-sala-zero-live-webgl-offline.html
            products/studio-atlas/.artifacts/awc-s3b-*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Preserve illustrated atelier screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-atlas-atelier-design-02
          path: ${{ runner.temp }}/studio-atelier-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Preserve ESS-01B teacher and learner screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ess-01b-interactive-image
          path: ${{ runner.temp }}/ess-01b-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-atlas-atlas-preview-e2e-logs
          path: |
            /tmp/studio-atlas-e2e.log
            /tmp/atlas-e2e.log
            _atlas/test-results
          if-no-files-found: ignore
          retention-days: 7
