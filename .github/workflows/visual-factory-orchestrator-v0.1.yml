name: Visual Factory — Zero-Cost Orchestrator v0.1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Eligibility only, canonical references, or locked-reference shots"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - references
          - shots
      plan_path:
        description: "Optional repository path to a governed visual generation plan; required for shots"
        required: false
        type: string
        default: ""
      preflight_path:
        description: "Repository path to persisted preflight evidence when plan_path is supplied"
        required: false
        type: string
        default: ""
      human_preflight_pass:
        description: "Explicit Human Preflight PASS for canonical references when no plan_path is supplied"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  orchestrate:
    name: Bounded FREE_ONLY visual orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VISUAL_FACTORY_EVIDENCE_DIR: ${{ github.workspace }}/visual-factory-evidence
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact declared Studio Atlas dependencies
        working-directory: products/studio-atlas
        run: npm install --no-audit --no-fund

      - name: Prepare governed generation plan and persisted preflight evidence
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          PLAN_PATH: ${{ inputs.plan_path }}
          PREFLIGHT_PATH: ${{ inputs.preflight_path }}
          HUMAN_PREFLIGHT_PASS: ${{ inputs.human_preflight_pass }}
        run: |
          set -euo pipefail
          if [ -n "$PLAN_PATH" ]; then
            test -f "$PLAN_PATH"
            test -n "$PREFLIGHT_PATH" || {
              echo "PLAN_PATH_REQUIRES_PERSISTED_PREFLIGHT_PATH" >&2
              exit 1
            }
            test -d "$PREFLIGHT_PATH"
            cp "$PLAN_PATH" /tmp/visual-generation-plan.json
            rm -rf /tmp/canonical-visual-preflight
            cp -R "$PREFLIGHT_PATH" /tmp/canonical-visual-preflight
          elif [ "$MODE" = "shots" ]; then
            echo "shots mode requires plan_path plus preflight_path pointing to human-locked, preflight-bound evidence" >&2
            exit 1
          else
            test "$HUMAN_PREFLIGHT_PASS" = "true" || {
              echo "CANONICAL_REFERENCE_PLAN_REQUIRES_EXPLICIT_HUMAN_PREFLIGHT_PASS" >&2
              exit 1
            }
            (
              cd products/studio-atlas
              npm run visual-factory:preflight-references -- \
                --output /tmp/canonical-visual-preflight \
                --human-preflight-pass
              npm run visual-factory:compile-reference-plan -- \
                --preflight /tmp/canonical-visual-preflight \
                --output /tmp/visual-generation-plan.json
            )
          fi

          # Diagnostic branch only: preserve the exact canonical Lia job and evidence,
          # while removing the other four jobs before provider execution.
          if [ "$MODE" = "references" ]; then
            node - <<'NODE'
          const fs = require("node:fs");
          const path = "/tmp/visual-generation-plan.json";
          const plan = JSON.parse(fs.readFileSync(path, "utf8"));
          if (plan.planType !== "REFERENCE_GENERATION" || plan.jobs?.[0]?.subjectRef !== "lia") {
            throw new Error("DIAGNOSTIC_SINGLE_LIA_PLAN_MISMATCH");
          }
          plan.jobs = [plan.jobs[0]];
          fs.writeFileSync(path, `${JSON.stringify(plan, null, 2)}\n`);
          NODE
          fi

          mkdir -p "$VISUAL_FACTORY_EVIDENCE_DIR"
          rm -rf "$VISUAL_FACTORY_EVIDENCE_DIR/preflight"
          cp -R /tmp/canonical-visual-preflight "$VISUAL_FACTORY_EVIDENCE_DIR/preflight"
          test -f "$VISUAL_FACTORY_EVIDENCE_DIR/preflight/manifest.json"

      - name: Execute bounded orchestrator dry-run
        if: inputs.mode == 'dry-run'
        working-directory: products/studio-atlas
        env:
          MODE: ${{ inputs.mode }}
        run: |
          npm run visual-factory:orchestrate -- \
            --mode "$MODE" \
            --plan /tmp/visual-generation-plan.json \
            --preflight "$VISUAL_FACTORY_EVIDENCE_DIR/preflight" \
            --output "$VISUAL_FACTORY_EVIDENCE_DIR"

      - name: Execute bounded orchestrator live
        if: inputs.mode != 'dry-run'
        working-directory: products/studio-atlas
        env:
          MODE: ${{ inputs.mode }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VISUAL_FACTORY_SPACE_REPO: ${{ vars.HF_VISUAL_FACTORY_SPACE_REPO }}
          VISUAL_FACTORY_ADMISSION_SECRET: ${{ secrets.HF_VISUAL_FACTORY_ADMISSION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_FREE_ADMITTED: ${{ vars.CLOUDFLARE_WORKERS_FREE_ADMITTED }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "LIVE_ZERO_COST_EXECUTION_REQUIRES_TRUSTED_CREDENTIAL_BINDING: HF_TOKEN is not configured" >&2
            exit 1
          }
          test -n "${HF_VISUAL_FACTORY_SPACE_REPO:-}" || {
            echo "LIVE_ZERO_COST_EXECUTION_REQUIRES_TRUSTED_CREDENTIAL_BINDING: HF_VISUAL_FACTORY_SPACE_REPO is not configured" >&2
            exit 1
          }
          test -n "${VISUAL_FACTORY_ADMISSION_SECRET:-}" || {
            echo "LIVE_ZERO_COST_EXECUTION_REQUIRES_TRUSTED_CREDENTIAL_BINDING: HF_VISUAL_FACTORY_ADMISSION_SECRET is not configured" >&2
            exit 1
          }
          npm run visual-factory:orchestrate -- \
            --mode "$MODE" \
            --plan /tmp/visual-generation-plan.json \
            --preflight "$VISUAL_FACTORY_EVIDENCE_DIR/preflight" \
            --output "$VISUAL_FACTORY_EVIDENCE_DIR"

      - name: Verify evidence remains non-authoritative
        run: |
          test -d visual-factory-evidence
          test -f visual-factory-evidence/preflight/manifest.json
          grep -R '"costClass": "FREE_ONLY"' visual-factory-evidence
          grep -R '"runtimeAuthorized": false' visual-factory-evidence
          grep -R '"publicationAuthorityGranted": false' visual-factory-evidence

      - name: Upload governed orchestration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-factory-orchestration-${{ github.run_id }}-${{ inputs.mode }}
          path: visual-factory-evidence/
          if-no-files-found: warn
          retention-days: 14
