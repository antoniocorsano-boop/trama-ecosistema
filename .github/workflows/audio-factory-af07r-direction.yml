name: AF-07R2 - Corrected pronunciation and WAV review
on:
  pull_request:
    types: [labeled]
    branches: [feat/audio-factory-af01-kokoro-pilot]
permissions:
  contents: read
concurrency:
  group: af07r-direction-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cpu-probe:
    if: >-
      github.event.repository.private == false &&
      github.event.pull_request.number == 304 &&
      github.event.label.name == 'af07r2-regia-autorizzata' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/audio-factory-af03-qwen3-prosody' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      CARGO_BUILD_JOBS: "4"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate offline constraints and fixture
        run: |
          python -m unittest discover -s services/audio-factory/tests -p 'test_*.py' -q
          mkdir -p af07r-direction
          python - <<'PY'
          import sys, json, pathlib
          sys.path.insert(0,'services/audio-factory')
          from af07r_selective_direction import plan as scene_plan
          plan=scene_plan()
          pathlib.Path('af07r-direction/transcript.txt').write_text('\n\n'.join(s['spoken'] for s in plan)+'\n', encoding='utf-8')
          PY
          free -h
          df -h .
      - name: Build pinned upstream CPU engine
        timeout-minutes: 14
        run: |
          git clone --filter=blob:none https://github.com/cartesia-one/csm.rs.git "$RUNNER_TEMP/csm"
          git -C "$RUNNER_TEMP/csm" checkout --detach facfd066bfbd632c815508e998bfd8b7665b8122
          cd "$RUNNER_TEMP/csm"
          RUSTFLAGS="-C target-cpu=native" cargo build --locked --release -p csm-cli --bin main
      - name: Download and verify official Q8 weights
        timeout-minutes: 4
        run: |
          curl --fail --location --silent --show-error --max-time 210 https://huggingface.co/cartesia/azzurra-voice/resolve/main/q8.gguf -o "$RUNNER_TEMP/azzurra-q8.gguf"
          echo "b0f0c5f9178e9b6c6f5034220023e40c3904eb035a679b0362ca6831e4360f9b  $RUNNER_TEMP/azzurra-q8.gguf" | sha256sum -c -
      - name: Generate three selected narration units
        timeout-minutes: 12
        run: |
          python services/audio-factory/af07r_selective_direction.py --mode generate --engine "$RUNNER_TEMP/csm/target/release/main" --weights "$RUNNER_TEMP/azzurra-q8.gguf" --output af07r-direction
      - name: Install qualified ASR
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --retries 0 "faster-whisper==1.2.1" "ctranslate2==4.9.0"
      - name: Blind lexical check
        timeout-minutes: 5
        run: python services/audio-factory/af07r_selective_direction.py --mode asr --output af07r-direction
      - name: Preserve evidence and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af07r2-direction-candidates
          path: af07r-direction/
          if-no-files-found: warn
          retention-days: 7
