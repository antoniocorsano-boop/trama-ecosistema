name: Validate Penpot design system

on:
  pull_request:
    paths:
      - "docs/design/TRAMA_PENPOT_*.md"
      - "docs/design/penpot/**"
      - "scripts/validate_penpot_design_system.py"
      - ".github/workflows/validate-penpot-design-system.yml"
  push:
    branches:
      - main
    paths:
      - "docs/design/TRAMA_PENPOT_*.md"
      - "docs/design/penpot/**"
      - "scripts/validate_penpot_design_system.py"
      - ".github/workflows/validate-penpot-design-system.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Penpot design system
        run: python3 scripts/validate_penpot_design_system.py
      - name: Validate token JSON
        run: python3 -m json.tool docs/design/penpot/TRAMA_TOKENS_V0_1.json > /dev/null
