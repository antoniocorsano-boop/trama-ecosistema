name: TRAMA Project Knowledge Runtime
on:
  pull_request:
    paths:
      - 'config/project-context-sources.json'
      - 'status/project-knowledge-events.json'
      - 'status/cc-mss-live-one-shot-predecision.json'
      - 'schemas/project-context-snapshot.schema.json'
      - 'schemas/trama-context-pack.schema.json'
      - 'scripts/build_project_context_snapshot.py'
      - 'scripts/build_trama_context_pack.py'
      - 'config/session-bootstrap-subjects.json'
      - 'schemas/session-bootstrap-receipt.schema.json'
      - 'scripts/build_session_bootstrap.py'
      - 'scripts/test_session_bootstrap.py'
      - 'docs/contracts/trama-session-bootstrap-v1.md'
      - 'docs/process/trama-development-continuity-protocol-v1.md'
      - 'docs/knowledge/governed-document-registry.json'
      - 'scripts/test_project_knowledge_runtime.py'
      - 'scripts/test_repository_observation_projection.py'
      - 'scripts/test_project_knowledge_dual_speed_stage_a.py'
      - 'scripts/compose_effective_project_context.py'
      - 'scripts/test_project_knowledge_dual_speed_stage_b.py'
      - 'scripts/run_live_repository_overlay.py'
      - 'scripts/test_project_knowledge_dual_speed_stage_c.py'
      - 'scripts/test_project_knowledge_dual_speed_stage_d.py'
      - 'scripts/validate_cc_mss_live_predecision.py'
      - 'schemas/repository-observation.schema.json'
      - 'scripts/test_repository_active_development_ref.py'
      - 'scripts/run_public_anonymous_repository_observation.py'
      - 'schemas/repository-enrollment.schema.json'
      - 'config/repository-enrollment.json'
      - 'schemas/live-repository-overlay.schema.json'
      - 'schemas/effective-project-context.schema.json'
      - 'schemas/source-registry.schema.json'
      - 'schemas/repository-observation-promotion-proposal.schema.json'
      - 'schemas/repository-observation-promotion-event.schema.json'
      - 'scripts/repository_observation_promotion_canonical.py'
      - 'scripts/test_repository_observation_promotion_canonical.py'
      - 'scripts/validate_repository_observation_promotion_semantics.py'
      - 'scripts/repository_observation_promotion_planner.py'
      - 'scripts/test_repository_observation_promotion_planner.py'
      - 'schemas/repository-observation-promotion-write-bundle.schema.json'
      - 'scripts/repository_observation_promotion_write_actor.py'
      - 'scripts/test_repository_observation_promotion_write_actor.py'
      - 'scripts/prepare_repository_observation_promotion_write_bundle.py'
      - 'scripts/test_repository_observation_promotion_prepare.py'
      - '.github/workflows/project-knowledge-promotion-write-one-shot.yml'
      - 'docs/control-center/CC2-PROJECT-KNOWLEDGE-PROMOTION-RUNTIME-ACTIVATION-01.md'
      - 'docs/control-center/CC2-REPOSITORY-OBSERVATION-PROMOTION-WRITE-ACTOR-01.md'
      - 'control-center/fixtures/project-knowledge/**'
      - 'scripts/validate_project_knowledge_schemas.py'
      - 'control-center/data/project-context-snapshot.json'
      - 'control-center/data/context-packs/**'
      - 'docs/knowledge/TRAMA-SECOND-BRAIN-OPERATING-MODEL.md'
      - '.github/workflows/project-knowledge-runtime.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check ProjectContextSnapshot
        run: python scripts/build_project_context_snapshot.py --check
      - name: Run Project Knowledge tests
        run: |
          python scripts/test_project_knowledge_runtime.py
          python scripts/test_session_bootstrap.py
          python scripts/test_repository_observation_projection.py
          python scripts/test_repository_active_development_ref.py
          python scripts/test_project_knowledge_dual_speed_stage_a.py
          python scripts/test_project_knowledge_dual_speed_stage_b.py
          python scripts/test_project_knowledge_dual_speed_stage_c.py
          python scripts/test_project_knowledge_dual_speed_stage_d.py
          python scripts/validate_cc_mss_live_predecision.py
          python scripts/test_repository_observation_promotion_canonical.py
          python scripts/validate_repository_observation_promotion_semantics.py
          python scripts/test_repository_observation_promotion_planner.py
          python scripts/test_repository_observation_promotion_write_actor.py
          python scripts/test_repository_observation_promotion_prepare.py
      - name: Audit session bootstrap read-only boundary
        run: |
          ! grep -En 'urllib|httpx|requests|socket|subprocess|os\.system|Popen|git push|gh pr|/merge' scripts/build_session_bootstrap.py
          grep -F '"readOnly": True' scripts/build_session_bootstrap.py
          grep -F '"authorizesWrite": False' scripts/build_session_bootstrap.py
          grep -F '"authorizesRuntime": False' scripts/build_session_bootstrap.py
          grep -F '"authorizesPromotion": False' scripts/build_session_bootstrap.py
      - name: Audit dual-speed Stage C ephemeral adapter boundary
        run: |
          grep -F 'tempfile.TemporaryDirectory' scripts/run_live_repository_overlay.py
          grep -F 'collector.collect' scripts/run_live_repository_overlay.py
          ! grep -En 'promotion_write_actor|repository_observation_promotion_write_actor|prepare_repository_observation_promotion|github.token|GITHUB_TOKEN|GH_TOKEN|git push|gh pr|/merge' scripts/run_live_repository_overlay.py
          ! grep -F 'control-center/data/repository-observation.live.json' scripts/run_live_repository_overlay.py
      - name: Audit dual-speed Stage B composer purity
        run: |
          ! grep -En 'urllib|httpx|requests|socket|subprocess|os\.system|Popen|git |gh |fetch\(|open\(|write_text|write_bytes|unlink|mkdir' scripts/compose_effective_project_context.py
          ! grep -En 'promotion_write_actor|repository_observation_promotion_write_actor' scripts/compose_effective_project_context.py
      - name: Audit promotion planner read-only surface
        run: |
          ! grep -En 'urllib|httpx|requests|socket|subprocess|os\.system|Popen|git push|gh pr' scripts/repository_observation_promotion_planner.py
          ! grep -En '\.write_text\(|\.write_bytes\(|open\(' scripts/repository_observation_promotion_planner.py
      - name: Audit promotion write actor capability boundary
        run: |
          ! grep -En '/merges|/merge|DELETE|PATCH|git push|subprocess|os\.system|requests\.|httpx\.' scripts/repository_observation_promotion_write_actor.py
          grep -F 'TARGET_REPOSITORY="antoniocorsano-boop/trama-ecosistema"' scripts/repository_observation_promotion_write_actor.py
          grep -F 'BRANCH_CONTAINS_UNEXPECTED_PATHS' scripts/repository_observation_promotion_write_actor.py
          grep -F 'BASE_HEAD_MISMATCH' scripts/repository_observation_promotion_write_actor.py
      - name: Audit promotion activation workflow boundary
        run: |
          grep -F 'workflow_dispatch:' .github/workflows/project-knowledge-promotion-write-one-shot.yml
          grep -F 'contents: write' .github/workflows/project-knowledge-promotion-write-one-shot.yml
          grep -F 'pull-requests: write' .github/workflows/project-knowledge-promotion-write-one-shot.yml
          grep -F 'persist-credentials: false' .github/workflows/project-knowledge-promotion-write-one-shot.yml
          grep -F 'env -i PATH="$PATH" HOME="$HOME"' .github/workflows/project-knowledge-promotion-write-one-shot.yml
          grep -F 'GITHUB_TOKEN:' .github/workflows/project-knowledge-promotion-write-one-shot.yml
          grep -F 'github.token' .github/workflows/project-knowledge-promotion-write-one-shot.yml
          ! grep -En 'upload-artifact|actions/cache|/merge|gh pr merge|DELETE|force-push' .github/workflows/project-knowledge-promotion-write-one-shot.yml
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Materialize derived outputs
        run: |
          python scripts/build_project_context_snapshot.py
          python scripts/build_trama_context_pack.py atlas-percorsi --output control-center/data/context-packs/atlas-percorsi.json
          python scripts/build_trama_context_pack.py project-knowledge --output control-center/data/context-packs/project-knowledge.json
          test -s control-center/data/project-context-snapshot.json
          test -s control-center/data/context-packs/atlas-percorsi.json
          test -s control-center/data/context-packs/project-knowledge.json
      - name: Validate generated outputs against JSON Schema
        run: python scripts/validate_project_knowledge_schemas.py
