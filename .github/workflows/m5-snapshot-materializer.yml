name: M5 Snapshot Materializer

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'docs/dos-m5-03-l5-qualification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/dos-m5-03-l5-qualification
      - name: Materialize canonical snapshot
        run: python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
      - name: Commit snapshot if changed
        shell: bash
        run: |
          if git diff --quiet -- control-center/data/ecosystem-snapshot.json; then
            echo "Snapshot already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control-center/data/ecosystem-snapshot.json
          git commit -m "DOS-M5-03 materialize canonical ecosystem snapshot"
          git push origin HEAD:docs/dos-m5-03-l5-qualification
