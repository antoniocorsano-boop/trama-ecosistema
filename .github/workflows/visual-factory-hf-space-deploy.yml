name: Visual Factory — HF ZeroGPU Space Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-factory-hf-space-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap private FREE_ONLY ZeroGPU Space
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy dependency
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.36.0"

      - name: Deploy bounded private ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VISUAL_FACTORY_SPACE_REPO: ${{ vars.HF_VISUAL_FACTORY_SPACE_REPO }}
          VISUAL_FACTORY_ADMISSION_SECRET: ${{ secrets.HF_VISUAL_FACTORY_ADMISSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "HF_SPACE_BOOTSTRAP_REQUIRES_TRUSTED_CREDENTIAL_BINDING: HF_TOKEN is not configured" >&2
            exit 1
          }
          test -n "${HF_VISUAL_FACTORY_SPACE_REPO:-}" || {
            echo "HF_SPACE_BOOTSTRAP_REQUIRES_TRUSTED_CREDENTIAL_BINDING: HF_VISUAL_FACTORY_SPACE_REPO is not configured" >&2
            exit 1
          }
          test -n "${VISUAL_FACTORY_ADMISSION_SECRET:-}" || {
            echo "HF_SPACE_BOOTSTRAP_REQUIRES_TRUSTED_CREDENTIAL_BINDING: HF_VISUAL_FACTORY_ADMISSION_SECRET is not configured" >&2
            exit 1
          }
          python scripts/deploy_visual_factory_hf_space.py \
            --repo-id "$HF_VISUAL_FACTORY_SPACE_REPO" \
            --source services/visual-factory-hf
