name: Visual Factory — Deploy HF Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy explicitly configured private ZeroGPU Space
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment client only
        run: pip install "huggingface_hub>=2.1.1"

      - name: Deploy or stop without mutation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VISUAL_FACTORY_SPACE_REPO: ${{ vars.HF_VISUAL_FACTORY_SPACE_REPO }}
        run: python scripts/deploy_visual_factory_hf_space.py

      - name: Authority boundary
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/deploy_visual_factory_hf_space.py")
          spec = importlib.util.spec_from_file_location("deploy_visual_factory_hf_space", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          kwargs = module.space_create_kwargs()
          assert kwargs["space_hardware"] == "zero-a10g"
          assert kwargs["space_sdk"] == "gradio"
          assert kwargs["private"] is True
          assert kwargs["exist_ok"] is True
          assert module.FREE_ZERO_GPU_BASE_SECONDS == 300.0
          PY
          ! grep -q 'request_space_hardware' scripts/deploy_visual_factory_hf_space.py
          grep -q 'NOT_CONFIGURED' scripts/deploy_visual_factory_hf_space.py
          grep -q 'FREE_ONLY_PRECHECK_FAILED' scripts/deploy_visual_factory_hf_space.py
