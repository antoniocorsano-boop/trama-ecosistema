name: M5 Finalize Projections

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'docs/dos-m5-03-l5-qualification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/dos-m5-03-l5-qualification
      - name: Restore canonical registry formatting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('governance/maturity/trama-maturity-evidence-registry-v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Rebuild canonical ecosystem snapshot
        run: python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
      - name: Commit canonical projections if changed
        shell: bash
        run: |
          if git diff --quiet -- governance/maturity/trama-maturity-evidence-registry-v1.json control-center/data/ecosystem-snapshot.json; then
            echo "Registry and snapshot already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/maturity/trama-maturity-evidence-registry-v1.json control-center/data/ecosystem-snapshot.json
          git commit -m "DOS-M5-03 normalize registry and refresh snapshot"
          git push origin HEAD:docs/dos-m5-03-l5-qualification
