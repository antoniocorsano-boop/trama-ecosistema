name: TRAMA Post-Merge Baseline Integrity

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trama-post-merge-baseline-integrity
  cancel-in-progress: false

jobs:
  baseline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout merged main baseline
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check --quiet jsonschema

      - name: Verify project context snapshot is reproducible
        run: python scripts/build_project_context_snapshot.py --check

      - name: Validate project knowledge schemas
        run: python scripts/validate_project_knowledge_schemas.py

      - name: Verify Component Evidence Lane v2 effective read model
        run: python scripts/test_component_evidence_lane_v2.py

      - name: Verify post-merge check remains read-only
        run: python scripts/test_post_merge_baseline_integrity_contract.py
