name: TRAMA Access
on:
  push:
    branches:
      - 'phase/access-01-phase-2-trama-access-runtime'
  pull_request:
    paths:
      - 'apps/access/**'
      - 'scripts/*trama-access-phase2*'
      - '.github/workflows/trama-access.yml'
      - '.github/workflows/governance.yml'
permissions:
  contents: read
jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/access/package-lock.json
      - name: Install Access dependencies
        working-directory: apps/access
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: apps/access
        run: npm test
      - name: Typecheck
        working-directory: apps/access
        run: npm run typecheck
      - name: Build
        working-directory: apps/access
        run: npm run build
      - name: Install Chromium
        working-directory: apps/access
        run: npx playwright install --with-deps chromium
      - name: Browser certification
        working-directory: apps/access
        run: npm run test:e2e
      - name: Test Phase 2 invariant validator
        run: node scripts/test-trama-access-phase2-validator.mjs
      - name: Validate Phase 2 branch scope and runtime invariants
        run: node scripts/validate-trama-access-phase2.mjs --base origin/main
