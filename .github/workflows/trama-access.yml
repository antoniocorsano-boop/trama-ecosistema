name: TRAMA Access
on:
  push:
    branches:
      - 'phase/access-01-phase-2-trama-access-runtime'
  pull_request:
    paths:
      - 'apps/access/**'
      - 'scripts/*trama-access-phase2*'
      - '.github/workflows/trama-access.yml'
      - '.github/workflows/governance.yml'
permissions:
  contents: read
jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Access dependencies
        working-directory: apps/access
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: apps/access
        run: npm test
      - name: Typecheck
        working-directory: apps/access
        run: npm run typecheck
      - name: Build
        working-directory: apps/access
        run: npm run build
      - name: Install Chromium
        working-directory: apps/access
        run: npx playwright install --with-deps chromium
      - name: Browser certification
        working-directory: apps/access
        run: npm run test:e2e
      - name: Test Phase 2 invariant validator
        run: node scripts/test-trama-access-phase2-validator.mjs
      - name: Validate Phase 2 branch scope and runtime invariants
        run: node scripts/validate-trama-access-phase2.mjs --base origin/main
      - name: Prepare Task 9 generated artifacts
        run: |
          mkdir -p _generated
          cp apps/access/package-lock.json _generated/package-lock.json
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/governance.yml').read_text()
          needle = '      - {name: Test ACCESS-01 professional identity contract adversarial cases, run: node scripts/test-trama-professional-identity-contract-validator.mjs}\n'
          addition = (
              needle
              + '      - {name: Validate ACCESS-01 Phase 2 runtime invariants, run: node scripts/validate-trama-access-phase2.mjs}\n'
              + '      - {name: Test ACCESS-01 Phase 2 validator adversarial cases, run: node scripts/test-trama-access-phase2-validator.mjs}\n'
          )
          if source.count(needle) != 1:
              raise SystemExit('Phase 1 Governance anchor missing or ambiguous')
          Path('_generated/governance.yml').write_text(source.replace(needle, addition, 1))
          PY
      - name: Upload Task 9 generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: access-phase2-task9-generated
          path: |
            _generated/package-lock.json
            _generated/governance.yml
          if-no-files-found: error
          retention-days: 1
