name: TRAMA Access
on:
  push:
    branches:
      - 'phase/access-01-phase-2-trama-access-runtime'
  pull_request:
    paths:
      - 'apps/access/**'
      - 'scripts/*trama-access-phase2*'
      - '.github/workflows/trama-access.yml'
      - '.github/workflows/governance.yml'
permissions:
  contents: write
jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Access dependencies
        working-directory: apps/access
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: apps/access
        run: npm test
      - name: Typecheck
        working-directory: apps/access
        run: npm run typecheck
      - name: Build
        working-directory: apps/access
        run: npm run build
      - name: Install Chromium
        working-directory: apps/access
        run: npx playwright install --with-deps chromium
      - name: Browser certification
        working-directory: apps/access
        run: npm run test:e2e
      - name: Test Phase 2 invariant validator
        run: node scripts/test-trama-access-phase2-validator.mjs
      - name: Validate Phase 2 branch scope and runtime invariants
        run: node scripts/validate-trama-access-phase2.mjs --base origin/main
      - name: Materialize dependency lock on the phase branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase/access-01-phase-2-trama-access-runtime'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/access/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock already committed'
          else
            git commit -m 'ci(access): lock phase 2 dependencies'
            git push origin HEAD:phase/access-01-phase-2-trama-access-runtime
          fi
