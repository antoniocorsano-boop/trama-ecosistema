name: Audit v1.4 governed reconciliation one-shot

on:
  push:
    branches:
      - docs/audit-v1-4-live-visual-proof
    paths:
      - .github/workflows/audit-v1-4-reconcile-one-shot.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/audit-v1-4-live-visual-proof
          fetch-depth: 0

      - name: Reconcile canonical sources
        run: python scripts/audit_v1_4_reconcile_one_shot.py

      - name: Regenerate governed projections
        run: |
          python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
          python scripts/build_project_context_snapshot.py --output control-center/data/project-context-snapshot.json
          python scripts/build_trama_context_pack.py project-knowledge \
            --snapshot control-center/data/project-context-snapshot.json \
            --output control-center/data/context-packs/project-knowledge.json

      - name: Restrict governed delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(docs/audits/TRAMA-AUDIT-2026-10-03.md|STATUS.md|status/project-knowledge-events.json|control-center/data/ecosystem-snapshot.json|control-center/data/project-context-snapshot.json|control-center/data/context-packs/project-knowledge.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit governed Audit v1.4 delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trama-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/audits/TRAMA-AUDIT-2026-10-03.md STATUS.md status/project-knowledge-events.json \
            control-center/data/ecosystem-snapshot.json \
            control-center/data/project-context-snapshot.json \
            control-center/data/context-packs/project-knowledge.json
          git commit -m 'docs: reconcile Audit v1.4 live visual proof'
          git push origin HEAD:docs/audit-v1-4-live-visual-proof
