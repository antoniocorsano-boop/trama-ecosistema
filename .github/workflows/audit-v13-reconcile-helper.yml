name: Audit v1.3 reconciliation helper

on:
  push:
    branches:
      - docs/audit-v1-3-studio-atlas-baseline
    paths:
      - scripts/apply_audit_v13_reconciliation.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved Audit v1.3 reconciliation
        run: python scripts/apply_audit_v13_reconciliation.py
      - name: Verify focused maturity contracts
        run: |
          python scripts/test_maturity_reconciliation.py
          python scripts/test_component_evidence_expansion.py
      - name: Regenerate governed projections
        run: |
          python scripts/build_ecosystem_snapshot.py
          python scripts/build_project_context_snapshot.py
          python scripts/build_trama_context_pack.py project-knowledge --snapshot control-center/data/project-context-snapshot.json --output control-center/data/context-packs/project-knowledge.json
      - name: Verify complete Audit v1.3 contract
        run: |
          python scripts/build_ecosystem_snapshot.py --check
          python scripts/build_project_context_snapshot.py --check
          python scripts/test_maturity_reconciliation.py
          python scripts/test_component_evidence_expansion.py
          python -m unittest tests.test_p3_status_alignment -v
      - name: Commit reconciled baseline
        run: |
          git config user.name 'trama-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add STATUS.md docs/audits/TRAMA-AUDIT-2026-10-03.md config/maturity-area-definitions.json governance/maturity/trama-maturity-evidence-registry-v1.json governance/maturity/trama-maturity-reconciliation-v1.json scripts/build_ecosystem_snapshot_core.py scripts/test_maturity_reconciliation.py scripts/test_component_evidence_expansion.py status/project-knowledge-events.json control-center/data/ecosystem-snapshot.json control-center/data/project-context-snapshot.json control-center/data/context-packs/project-knowledge.json
          if git diff --cached --quiet; then
            echo 'No reconciliation changes to commit.'
          else
            git commit -m 'docs: reconcile Audit v1.3 Studio Atlas baseline'
            git push origin HEAD:docs/audit-v1-3-studio-atlas-baseline
          fi
