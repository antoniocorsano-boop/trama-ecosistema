name: Visual Factory — Generation Pipeline v0.2

on:
  pull_request:
    paths:
      - "docs/capabilities/atlas-percorsi/production/VISUAL-GENERATION-PIPELINE-v0.2.md"
      - "docs/capabilities/atlas-percorsi/pathways/PW-STRATEGY-SELECTION-01/worlds/MUSEO-ZERO/museo-zero.visual-bible-v0.2.json"
      - "docs/capabilities/atlas-percorsi/pathways/PW-STRATEGY-SELECTION-01/worlds/MUSEO-ZERO/museo-zero.visual-shot-plan-v0.2.json"
      - "schemas/atlas-visual-bible.v0.1.schema.json"
      - "schemas/atlas-visual-shot-plan.v0.1.schema.json"
      - "scripts/compile_visual_generation_plan.py"
      - "scripts/deploy_visual_factory_hf_space.py"
      - "services/visual-factory-hf/**"
      - "fixtures/visual-factory-generation/**"
      - "tests/test_visual_generation_plan.py"
      - "tests/test_visual_factory_hf_contract.py"
      - "tests/test_visual_factory_hf_deploy_zero_gpu.py"
      - "products/studio-atlas/lib/visual-factory*.ts"
      - "products/studio-atlas/scripts/run-visual-factory-orchestrator.ts"
      - "products/studio-atlas/package.json"
      - ".github/workflows/visual-factory-generation-v0.2.yml"
      - ".github/workflows/visual-factory-orchestrator-v0.1.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: Character-first generation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require bounded orchestrator qualification surface
        run: |
          test -f .github/workflows/visual-factory-orchestrator-v0.1.yml
          test -f products/studio-atlas/scripts/run-visual-factory-orchestrator.ts
          grep -q '"visual-factory:orchestrate"' products/studio-atlas/package.json
          grep -q 'workflow_dispatch:' .github/workflows/visual-factory-orchestrator-v0.1.yml
          grep -q 'CLOUDFLARE_WORKERS_FREE_ADMITTED' .github/workflows/visual-factory-orchestrator-v0.1.yml
          grep -q 'FREE_ONLY' products/studio-atlas/scripts/run-visual-factory-orchestrator.ts
          ! grep -Eq '^[[:space:]]+(HF_TOKEN|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID):' .github/workflows/visual-factory-generation-v0.2.yml

      - name: Unit tests
        run: |
          python -m unittest tests/test_visual_generation_plan.py -v
          python -m unittest tests/test_visual_factory_hf_contract.py -v
          python -m unittest tests/test_visual_factory_hf_deploy_zero_gpu.py -v

      - name: Compile unlocked reference jobs
        run: |
          python scripts/compile_visual_generation_plan.py \
            --visual-bible docs/capabilities/atlas-percorsi/pathways/PW-STRATEGY-SELECTION-01/worlds/MUSEO-ZERO/museo-zero.visual-bible-v0.2.json \
            --mode references \
            --output /tmp/reference-plan.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/reference-plan.json"))
          assert p["decision"] == "REFERENCE_GENERATION_READY"
          assert len(p["jobs"]) == 5
          assert all(j["workflowFamily"] == "flux2-klein-4b/v0.2" for j in p["jobs"])
          assert not p["runtimeAuthorized"]
          assert not p["publicationAuthorityGranted"]
          PY

      - name: Prove unlocked scene production fails closed
        run: |
          python scripts/compile_visual_generation_plan.py \
            --visual-bible docs/capabilities/atlas-percorsi/pathways/PW-STRATEGY-SELECTION-01/worlds/MUSEO-ZERO/museo-zero.visual-bible-v0.2.json \
            --mode shots \
            --shot-plan fixtures/visual-factory-generation/museo-zero.visual-shot-plan.json \
            --output /tmp/blocked-shot-plan.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/blocked-shot-plan.json"))
          assert p["decision"] == "STOP_REFERENCE_LOCK_REQUIRED"
          assert p["jobs"] == []
          assert p["blockers"]
          PY

      - name: Compile locked F1-F6 production jobs
        run: |
          python scripts/compile_visual_generation_plan.py \
            --visual-bible fixtures/visual-factory-generation/museo-zero-locked.visual-bible.json \
            --mode shots \
            --shot-plan fixtures/visual-factory-generation/museo-zero.visual-shot-plan.json \
            --output /tmp/shot-plan.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/shot-plan.json"))
          assert p["decision"] == "SHOT_GENERATION_READY"
          assert [j["shotId"] for j in p["jobs"]] == ["F1","F2","F3","F4","F5","F6"]
          assert all(j["workflowFamily"] == "flux2-klein-4b/v0.2" for j in p["jobs"])
          assert all(j["referenceInputs"] for j in p["jobs"])
          assert not p["paidComputeAuthorized"]
          PY

      - name: Executor safety inspection
        run: |
          test -f services/visual-factory-hf/app.py
          test -f services/visual-factory-hf/contract.py
          test -f services/visual-factory-hf/requirements.txt
          python -m py_compile services/visual-factory-hf/app.py services/visual-factory-hf/contract.py scripts/deploy_visual_factory_hf_space.py
          grep -q '@spaces.GPU' services/visual-factory-hf/app.py
          grep -q 'black-forest-labs/FLUX.2-klein-4B' services/visual-factory-hf/app.py
          ! grep -Ei 'purchase|billing|credit.card|paid.fallback' services/visual-factory-hf/app.py services/visual-factory-hf/contract.py

      - name: Prove deployment is inert without explicit HF configuration
        run: |
          output="$(env -u HF_TOKEN -u HF_VISUAL_FACTORY_SPACE_REPO python scripts/deploy_visual_factory_hf_space.py)"
          test "$output" = "NOT_CONFIGURED"
