name: Control Center A2 Lock Bootstrap
on:
  pull_request:
    paths:
      - "apps/control-center/package.json"
      - "apps/control-center/package-lock.json"
      - ".github/workflows/control-center-a2-lock-bootstrap.yml"
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Persist lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "A2: refresh deterministic npm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
