name: TRAMA Public Anonymous Transport Qualification
on:
  pull_request:
    paths:
      - 'scripts/public_anonymous_transport.py'
      - 'scripts/run_public_anonymous_repository_observation.py'
      - 'scripts/test_public_anonymous_transport.py'
      - '.github/workflows/public-anonymous-transport-qualification.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Qualification mode only; live execution is not implemented in this workflow'
        required: true
        default: 'QUALIFY_OFFLINE'
        type: choice
        options:
          - QUALIFY_OFFLINE
jobs:
  validate:
    if: github.event_name == 'pull_request' || inputs.mode == 'QUALIFY_OFFLINE'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_public_anonymous_transport.py
      - name: Capability audit
        run: |
          ! grep -En 'Authorization|Bearer|GITHUB_TOKEN|GH_TOKEN|subprocess|requests\.|httpx\.|socket|os\.environ' scripts/public_anonymous_transport.py scripts/run_public_anonymous_repository_observation.py
          grep -q 'api.github.com' scripts/public_anonymous_transport.py
          grep -q 'method="GET"' scripts/public_anonymous_transport.py
          grep -q 'allow_reserve=True' scripts/run_public_anonymous_repository_observation.py
          grep -q 'repository-observation.schema.json' scripts/run_public_anonymous_repository_observation.py
      - name: Assert no live collector step exists
        run: |
          ! grep -q 'run_public_anonymous_repository_observation.py' .github/workflows/public-anonymous-transport-qualification.yml
