name: AF-11 - Missione 118 V9 production candidate
on:
  pull_request:
    types: [synchronize, labeled, opened, reopened]
    branches: [feat/audio-factory-af03-qwen3-prosody]
permissions:
  contents: read
  actions: read
concurrency:
  group: af11-v9-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.event.pull_request.number == 312 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/af10-missione118-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline tests
        run: python -m unittest discover -s services/audio-factory/tests -p 'test_*.py' -q
  candidate:
    needs: qualify
    if: >-
      github.event.action == 'labeled' &&
      github.event.repository.private == false &&
      github.event.pull_request.number == 312 &&
      github.event.label.name == format('af11-{0}', github.event.pull_request.head.sha) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/af10-missione118-v9' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve approved A from R1
        uses: actions/download-artifact@v4
        with:
          name: af10-missione118-v9-pilot-r1
          run-id: 43484486214
          github-token: ${{ github.token }}
          path: approved/A
      - name: Retrieve approved B from original pilot
        uses: actions/download-artifact@v4
        with:
          name: af10-missione118-v9-pilot
          run-id: 43482300979
          github-token: ${{ github.token }}
          path: approved/B
      - name: Verify approved audio before inference
        run: |
          echo '6fcf7c3743847150e33484b0ef4ce94c10faca717febfb48e5652284ceab3d33  approved/A/S3U3.wav' | sha256sum -c -
          echo 'a96d5ae4d84fc4b1ff0466e319e9f11b04c2d2a27ece96b3c3b826de33f8e530  approved/B/S5U3.wav' | sha256sum -c -
      - name: Install qualified CPU synthesis dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --retries 1 --timeout 20 --only-binary=:all: -r services/audio-factory/requirements-kokoro.txt
      - name: Generate twelve units and reuse two approved WAVs
        timeout-minutes: 12
        run: python services/audio-factory/af11_v9_production.py --output af11-v9 --reuse approved
      - name: Install independent ASR
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --retries 0 "faster-whisper==1.2.1" "ctranslate2==4.9.0"
      - name: Blind lexical review of all five scenes
        timeout-minutes: 6
        run: python services/audio-factory/af11_v9_production.py --output af11-v9 --asr
      - name: Preserve candidate and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af11-missione118-v9
          path: af11-v9/
          if-no-files-found: warn
          retention-days: 7
