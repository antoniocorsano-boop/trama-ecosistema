name: Atlas Knowledge Candidate
on:
  pull_request:
    paths:
      - 'docs/capabilities/atlas-knowledge/**'
      - 'schemas/atlas-knowledge-candidate.v0.1.schema.json'
      - 'schemas/atlas-knowledge-candidate.v0.2.schema.json'
      - 'scripts/qualify_atlas_knowledge_candidate.py'
      - '.github/workflows/atlas-knowledge-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'docs/capabilities/atlas-knowledge/**'
      - 'schemas/atlas-knowledge-candidate.v0.1.schema.json'
      - 'schemas/atlas-knowledge-candidate.v0.2.schema.json'
      - 'scripts/qualify_atlas_knowledge_candidate.py'
      - '.github/workflows/atlas-knowledge-candidate.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - run: python scripts/qualify_atlas_knowledge_candidate.py
