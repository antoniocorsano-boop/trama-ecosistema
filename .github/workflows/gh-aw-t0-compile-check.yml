name: gh-aw T0 compile check

on:
  push:
    branches:
      - "gh-aw/t0-controlled-trial"
    paths:
      - ".github/workflows/trama-t0-issue-triage.md"
      - ".github/workflows/trama-t0-issue-triage.lock.yml"
      - ".github/workflows/gh-aw-t0-compile-check.yml"
  pull_request:
    paths:
      - ".github/workflows/trama-t0-issue-triage.md"
      - ".github/workflows/trama-t0-issue-triage.lock.yml"
      - ".github/workflows/gh-aw-t0-compile-check.yml"

permissions:
  contents: read

jobs:
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          gh aw version
      - name: Compile T0 strictly
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile trama-t0-issue-triage --strict
          test -f .github/workflows/trama-t0-issue-triage.lock.yml
      - name: Require controlled trial entrypoints
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  workflow_call:' .github/workflows/trama-t0-issue-triage.lock.yml
          grep -q '^  workflow_dispatch:' .github/workflows/trama-t0-issue-triage.lock.yml
          grep -q 'item_number:' .github/workflows/trama-t0-issue-triage.lock.yml
      - name: Publish compiled lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: trama-t0-issue-triage-lock
          path: .github/workflows/trama-t0-issue-triage.lock.yml
          if-no-files-found: error
          retention-days: 7
      - name: Dry-run controlled TrialOps plan for issue 117
        if: github.event_name == 'push' && github.ref_name == 'gh-aw/t0-controlled-trial' && github.actor != 'github-actions[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh aw trial ./.github/workflows/trama-t0-issue-triage.md \
            --host-repo . \
            --trigger-context 'https://github.com/antoniocorsano-boop/trama-ecosistema/issues/117' \
            --dry-run \
            --yes \
            --json
