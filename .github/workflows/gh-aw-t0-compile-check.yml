name: gh-aw T0 compile check

on:
  push:
    branches:
      - "gh-aw/t0-controlled-trial"
    paths:
      - ".github/workflows/trama-t0-issue-triage.md"
      - ".github/workflows/trama-t0-issue-triage.lock.yml"
      - ".github/workflows/gh-aw-t0-compile-check.yml"
  pull_request:
    paths:
      - ".github/workflows/trama-t0-issue-triage.md"
      - ".github/workflows/trama-t0-issue-triage.lock.yml"
      - ".github/workflows/gh-aw-t0-compile-check.yml"

permissions:
  contents: read

jobs:
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          gh aw version
      - name: Compile T0 strictly
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile trama-t0-issue-triage --strict
          test -f .github/workflows/trama-t0-issue-triage.lock.yml
      - name: Require controlled trial entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^  workflow_call:' .github/workflows/trama-t0-issue-triage.lock.yml
          grep -q 'item_number:' .github/workflows/trama-t0-issue-triage.lock.yml
      - name: Verify committed lock is synchronized
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows/trama-t0-issue-triage.lock.yml
      - name: Publish compiled lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: trama-t0-issue-triage-lock
          path: .github/workflows/trama-t0-issue-triage.lock.yml
          if-no-files-found: error
          retention-days: 7

  controlled-staged-trial:
    name: controlled-staged-trial-issue-117
    needs: compile-check
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/trama-t0-issue-triage.lock.yml
    with:
      item_number: 117
      aw_context: "P6 controlled staged qualification; analyze issue 117 only; no persistent writes."
    secrets:
      GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
