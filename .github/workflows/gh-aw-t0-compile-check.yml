name: gh-aw T0 compile check

on:
  push:
    branches:
      - main
      - "gh-aw/t0-controlled-trial"
    paths:
      - ".github/workflows/trama-t0-issue-triage.md"
      - ".github/workflows/trama-t0-issue-triage.lock.yml"
      - ".github/workflows/gh-aw-t0-compile-check.yml"
  pull_request:
    paths:
      - ".github/workflows/trama-t0-issue-triage.md"
      - ".github/workflows/trama-t0-issue-triage.lock.yml"
      - ".github/workflows/gh-aw-t0-compile-check.yml"

permissions:
  contents: read

jobs:
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install gh-aw
        shell: bash
        run: |
          set -euo pipefail
          curl -sL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash
          gh aw version
      - name: Compile T0 strictly
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile trama-t0-issue-triage --strict
          test -f .github/workflows/trama-t0-issue-triage.lock.yml
      - name: Require production-only staged contract
        shell: bash
        run: |
          set -euo pipefail
          source_file=.github/workflows/trama-t0-issue-triage.md
          lock_file=.github/workflows/trama-t0-issue-triage.lock.yml

          grep -q '^  issues:' "$source_file"
          grep -q 'types: \[opened, reopened\]' "$source_file"
          grep -q '^  staged: true$' "$source_file"
          ! grep -q '^  workflow_call:' "$source_file"
          ! grep -q '^  workflow_dispatch:' "$source_file"

          grep -q '^  issues:' "$lock_file"
          grep -q 'GH_AW_SAFE_OUTPUTS_STAGED:' "$lock_file"
          ! grep -q '^  workflow_call:' "$lock_file"
          ! grep -q '^  workflow_dispatch:' "$lock_file"
      - name: Publish compiled lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: trama-t0-issue-triage-lock
          path: .github/workflows/trama-t0-issue-triage.lock.yml
          if-no-files-found: error
          retention-days: 7
      - name: Synchronize generated lock (one-shot)
        if: github.event_name == 'push' && github.ref_name == 'gh-aw/t0-controlled-trial'
        shell: bash
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lock_file=.github/workflows/trama-t0-issue-triage.lock.yml
          if git diff --quiet -- "$lock_file"; then
            echo "Lock already synchronized."
            exit 0
          fi
          test -n "$GH_AW_GITHUB_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$lock_file"
          git commit -m "chore(gh-aw): synchronize production T0 lock"
          git push "https://x-access-token:${GH_AW_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
      - name: Verify committed lock is synchronized
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows/trama-t0-issue-triage.lock.yml
