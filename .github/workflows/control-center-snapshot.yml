name: Validate TRAMA Ecosystem Snapshot

on:
  pull_request:
    paths:
      - "config/control-center-snapshot-sources.json"
      - "config/maturity-area-definitions.json"
      - "scripts/evaluate_maturity_definitions.py"
      - "config/maturity-area-definitions.json"
      - "scripts/evaluate_maturity_definitions.py"
      - "scripts/build_ecosystem_snapshot.py"
      - "schemas/ecosystem-snapshot.schema.json"
      - "status/ecosystem-status.json"
      - "docs/decisions/decision-register.json"
      - "STATUS.md"
      - "ROADMAP.md"
      - ".github/workflows/control-center-snapshot.yml"
  push:
    branches: ["main"]
    paths:
      - "config/control-center-snapshot-sources.json"
      - "scripts/build_ecosystem_snapshot.py"
      - "schemas/ecosystem-snapshot.schema.json"
      - "status/ecosystem-status.json"
      - "docs/decisions/decision-register.json"
      - "STATUS.md"
      - "ROADMAP.md"
      - ".github/workflows/control-center-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate snapshot foundation
        run: python scripts/build_ecosystem_snapshot.py --check
      - name: Build snapshot fixture
        run: python scripts/build_ecosystem_snapshot.py --output /tmp/ecosystem-snapshot.json
      - name: Validate generated snapshot against JSON Schema
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("schemas/ecosystem-snapshot.schema.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path("/tmp/ecosystem-snapshot.json").read_text(encoding="utf-8"))

          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = sorted(validator.iter_errors(snapshot), key=lambda e: list(e.absolute_path))
          if errors:
              for error in errors:
                  path = ".".join(str(p) for p in error.absolute_path) or "<root>"
                  print(f"{path}: {error.message}")
              raise SystemExit(1)

          print("TRAMA_ECOSYSTEM_SNAPSHOT_SCHEMA_PASS")
          PY
      - name: Validate conservative maturity wiring
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path("/tmp/ecosystem-snapshot.json").read_text(encoding="utf-8"))
          areas = {area["id"]: area for area in snapshot["areas"]}
          expected = {"governance", "arena", "atlas", "docente-os"}
          assert set(areas) == expected, set(areas)
          for area in areas.values():
              assert area["candidateLevel"] == area["confirmedLevel"], area
              assert area["status"] == "PARTIAL", area
              assert area["confidence"] == "LOW", area
          print("TRAMA_MATURITY_WIRING_CONSERVATIVE_PASS")
          PY
      - name: Validate read-only contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq "(requests\.(post|put|patch|delete)|urllib\.request\.Request.*method=['\"](POST|PUT|PATCH|DELETE)|Authorization:|Bearer )" scripts/build_ecosystem_snapshot.py
          grep -q '"confirmedLevel"' schemas/ecosystem-snapshot.schema.json
          grep -q '"candidateLevel"' schemas/ecosystem-snapshot.schema.json
          grep -q '"evidence"' schemas/ecosystem-snapshot.schema.json
          grep -q '"gates"' schemas/ecosystem-snapshot.schema.json
