name: Validate TRAMA Ecosystem Snapshot

on:
  pull_request:
    paths:
      - "config/control-center-snapshot-sources.json"
      - "config/maturity-area-definitions.json"
      - "config/stakeholder-assurance-registry.json"
      - "scripts/validate_stakeholder_assurance.py"
      - "schemas/maturity-area-definitions.schema.json"
      - "tests/fixtures/cc2-f1d/**"
      - "scripts/evaluate_maturity_definitions.py"
      - "scripts/build_ecosystem_snapshot.py"
      - "schemas/ecosystem-snapshot.schema.json"
      - "status/ecosystem-status.json"
      - "docs/decisions/decision-register.json"
      - "STATUS.md"
      - "ROADMAP.md"
      - ".github/workflows/control-center-snapshot.yml"
  push:
    branches: ["main"]
    paths:
      - "config/control-center-snapshot-sources.json"
      - "config/maturity-area-definitions.json"
      - "config/stakeholder-assurance-registry.json"
      - "scripts/validate_stakeholder_assurance.py"
      - "schemas/maturity-area-definitions.schema.json"
      - "tests/fixtures/cc2-f1d/**"
      - "scripts/evaluate_maturity_definitions.py"
      - "scripts/build_ecosystem_snapshot.py"
      - "schemas/ecosystem-snapshot.schema.json"
      - "status/ecosystem-status.json"
      - "docs/decisions/decision-register.json"
      - "STATUS.md"
      - "ROADMAP.md"
      - ".github/workflows/control-center-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate snapshot foundation
        run: python scripts/build_ecosystem_snapshot.py --check
      - name: Build snapshot fixture
        run: python scripts/build_ecosystem_snapshot.py --output /tmp/ecosystem-snapshot.json
      - name: Validate generated snapshot against JSON Schema
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("schemas/ecosystem-snapshot.schema.json").read_text(encoding="utf-8"))
          snapshot = json.loads(Path("/tmp/ecosystem-snapshot.json").read_text(encoding="utf-8"))

          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = sorted(validator.iter_errors(snapshot), key=lambda e: list(e.absolute_path))
          if errors:
              for error in errors:
                  path = ".".join(str(p) for p in error.absolute_path) or "<root>"
                  print(f"{path}: {error.message}")
              raise SystemExit(1)

          print("TRAMA_ECOSYSTEM_SNAPSHOT_SCHEMA_PASS")
          PY
      - name: Validate conservative maturity wiring
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path("/tmp/ecosystem-snapshot.json").read_text(encoding="utf-8"))
          areas = {area["id"]: area for area in snapshot["areas"]}
          expected = {"governance", "arena", "atlas", "docente-os"}
          assert set(areas) == expected, set(areas)
          for area in areas.values():
              assert area["candidateLevel"] == area["confirmedLevel"], area
              assert area["status"] == "PARTIAL", area
              assert area["confidence"] == "LOW", area
          print("TRAMA_MATURITY_WIRING_CONSERVATIVE_PASS")
          PY
      - name: Validate CC2-F4 capability projection
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path("/tmp/ecosystem-snapshot.json").read_text(encoding="utf-8"))
          source = json.loads(Path("status/ecosystem-status.json").read_text(encoding="utf-8"))
          source_ids = {item["id"] for item in source["capabilities"]}
          projected = {item["id"]: item for item in snapshot["capabilities"]}
          assert set(projected) == source_ids, (set(projected), source_ids)
          for item in projected.values():
              assert item["sourceRef"] == "status/ecosystem-status.json", item
              assert item["sourceUpdatedAt"] == source["updatedAt"], item
              assert item["evidenceRefs"] == ["EV-SOURCE-ECOSYSTEM-STATUS"], item
              assert item["lastSignificantChange"] is None, item
          assert projected["DOS-A1"]["runtimeState"] == "DEFERRED"
          for cap_id, item in projected.items():
              if cap_id != "DOS-A1":
                  assert item["runtimeState"] is None, item

          dependencies = {item["id"]: item for item in snapshot["dependencies"]}
          assert set(dependencies) == {
              "DEP-ARENA-DOS-AUTHORITY",
              "DEP-ARENA-ATLAS-DATA",
              "DEP-DOS-ATLAS-FUTURE",
          }, dependencies
          assert dependencies["DEP-DOS-ATLAS-FUTURE"]["status"] == "NOT_AUTHORIZED"
          print("TRAMA_CC2_F4_CAPABILITY_PROJECTION_PASS")
          PY
      - name: Validate CC2-F1/D evidence hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from jsonschema import Draft202012Validator

          from scripts.evaluate_maturity_definitions import (
              evaluate_area,
              validate_definitions,
              validate_evidence_record,
          )

          definitions = json.loads(Path("config/maturity-area-definitions.json").read_text(encoding="utf-8"))
          definition_schema = json.loads(Path("schemas/maturity-area-definitions.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(definition_schema)
          errors = list(Draft202012Validator(definition_schema).iter_errors(definitions))
          assert not errors, [e.message for e in errors]
          validate_definitions(definitions)

          unbound = json.loads(Path("tests/fixtures/cc2-f1d/unbound-human-review.json").read_text(encoding="utf-8"))[0]
          try:
              validate_evidence_record(unbound)
          except ValueError:
              pass
          else:
              raise AssertionError("unbound strong evidence must be rejected")

          bound = json.loads(Path("tests/fixtures/cc2-f1d/bound-human-review.json").read_text(encoding="utf-8"))[0]
          validate_evidence_record(bound)

          expired = json.loads(Path("tests/fixtures/cc2-f1d/expired-time-bound.json").read_text(encoding="utf-8"))
          governance = next(area for area in definitions["areas"] if area["id"] == "governance")
          result = evaluate_area(
              governance,
              expired,
              now=datetime(2026, 9, 24, tzinfo=timezone.utc),
          )
          assert result["confirmedLevel"] == 0, result
          assert result["currentEvidenceRefs"] == [], result

          assert next(a for a in definitions["areas"] if a["id"] == "atlas")["dependencies"] == ["governance", "arena"]
          print("TRAMA_CC2_F1D_EVIDENCE_HARDENING_PASS")
          PY
      - name: Validate read-only contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq "(requests\.(post|put|patch|delete)|urllib\.request\.Request.*method=['\"](POST|PUT|PATCH|DELETE)|Authorization:|Bearer )" scripts/build_ecosystem_snapshot.py
          grep -q '"confirmedLevel"' schemas/ecosystem-snapshot.schema.json
          grep -q '"candidateLevel"' schemas/ecosystem-snapshot.schema.json
          grep -q '"evidence"' schemas/ecosystem-snapshot.schema.json
          grep -q '"gates"' schemas/ecosystem-snapshot.schema.json
          grep -q '"capabilities"' schemas/ecosystem-snapshot.schema.json
          grep -q '"governanceRefs"' schemas/ecosystem-snapshot.schema.json

