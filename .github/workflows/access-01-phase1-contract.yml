name: ACCESS-01 Phase 1 Contract TDD
on:
  pull_request:
    paths:
      - 'governance/access/**'
      - 'docs/contracts/TRAMA-PROFESSIONAL-IDENTITY-01.md'
      - 'docs/evidence/access-01/**'
      - 'scripts/test-trama-professional-identity-contract-validator.mjs'
      - 'scripts/validate-trama-professional-identity-contract.mjs'
      - '.github/workflows/access-01-phase1-contract.yml'
permissions:
  contents: read
jobs:
  contract-tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ACCESS-01 Phase 1 contract test
        run: node scripts/test-trama-professional-identity-contract-validator.mjs
