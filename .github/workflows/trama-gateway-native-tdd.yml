name: TRAMA Gateway Native TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'policies/design-system/**'
      - 'scripts/**'
      - 'apps/gateway/**'
      - '.github/workflows/trama-gateway-native-tdd.yml'

permissions:
  contents: write

jobs:
  native-tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version
      - name: Root validator tests
        run: |
          node scripts/test-design-system-validator.mjs
          node scripts/test-trama-parent-identity-validator.mjs
      - name: Detect committed gateway lockfile
        id: gateway-lock-state
        shell: bash
        run: |
          if git ls-files --error-unmatch apps/gateway/package-lock.json >/dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install gateway dependencies
        if: ${{ hashFiles('apps/gateway/package.json') != '' }}
        shell: bash
        run: |
          cd apps/gateway
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Persist generated gateway lockfile
        if: ${{ steps.gateway-lock-state.outputs.tracked == 'false' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const content = fs.readFileSync('apps/gateway/package-lock.json').toString('base64');
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/apps/gateway/package-lock.json`, {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: 'chore: lock TRAMA gateway dependencies',
              content,
              branch: process.env.HEAD_REF,
            }),
          });
          if (!response.ok) throw new Error(`lockfile persistence failed: ${response.status} ${await response.text()}`);
          console.log('gateway package-lock committed to PR head branch');
          NODE
      - name: Gateway package checks
        if: ${{ hashFiles('apps/gateway/package.json') != '' }}
        shell: bash
        env:
          VITE_TRAMA_ENTRY_HREF: /ecosistema
        run: |
          cd apps/gateway
          npm test
          npm run typecheck
          npm run build
          if npm run | grep -q 'test:e2e'; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          fi
      - name: Evidence materializer tests when present
        shell: bash
        run: |
          if [ -f scripts/test-materialize-trama-gateway-ui-evidence.mjs ]; then
            node scripts/test-materialize-trama-gateway-ui-evidence.mjs
          fi
