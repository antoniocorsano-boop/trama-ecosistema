name: Task 11 Lockfile Helper
on:
  pull_request:
    paths:
      - 'apps/access/package.json'
      - '.github/workflows/task11-lockfile-helper.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact npm lockfile
        working-directory: apps/access
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify pinned dependency
        working-directory: apps/access
        run: node -e "const p=require('./package-lock.json'); if(p.packages[''].dependencies['@supabase/supabase-js']!=='2.117.3') process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: task11-access-package-lock
          path: apps/access/package-lock.json
          if-no-files-found: error
