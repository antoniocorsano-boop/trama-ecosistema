name: Task 11 Lockfile Helper
on:
  pull_request:
    paths:
      - 'apps/access/package.json'
      - '.github/workflows/task11-lockfile-helper.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact npm lockfile
        working-directory: apps/access
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify pinned dependency
        working-directory: apps/access
        run: node -e "const p=require('./package-lock.json'); if(p.packages[''].dependencies['@supabase/supabase-js']!=='2.117.3') process.exit(1)"
      - name: Commit generated lockfile once
        run: |
          if git diff --quiet -- apps/access/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/access/package-lock.json
          git commit -m "chore(access): refresh supabase dependency lock"
          git push origin HEAD:${{ github.head_ref }}
