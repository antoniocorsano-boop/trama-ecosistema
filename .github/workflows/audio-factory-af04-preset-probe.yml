name: AF-04 - Fixed synthetic narrator one shot
on:
  pull_request:
    types: [labeled]
    branches: [feat/audio-factory-af01-kokoro-pilot]
permissions:
  contents: read
concurrency:
  group: af04-preset-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event.pull_request.number == 304 &&
      github.event.label.name == 'af04-provino-autorizzato' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/audio-factory-af03-qwen3-prosody' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TRAMA_AF04_PRESET_PROBE_AUTHORIZED: "yes"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline tests and exact text
        run: |
          python services/audio-factory/af04_preset_probe.py --validate-only
          python -m unittest discover -s services/audio-factory/tests -p 'test_*.py' -q
      - name: Install anonymous client
        timeout-minutes: 2
        run: python -m pip install --disable-pip-version-check --retries 0 --timeout 20 "gradio_client>=1.13,<3"
      - name: One built-in speaker request
        timeout-minutes: 4
        run: python services/audio-factory/af04_preset_probe.py --output af04-preset-probe
      - name: Preserve WAV and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af04-ryan-probe-listening
          path: af04-preset-probe/
          if-no-files-found: warn
          retention-days: 7
