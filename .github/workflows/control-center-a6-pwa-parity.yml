name: Control Center A6 PWA Parity
on:
  pull_request:
    paths:
      - "apps/control-center/**"
      - "control-center/data/ecosystem-snapshot.json"
      - "control-center/data/context-packs/project-knowledge.json"
      - "schemas/ecosystem-snapshot.schema.json"
      - "governance/control-center/trama-control-center-a6-parity-matrix.json"
      - "docs/implementation/trama-control-center-a6-pwa-parity.md"
      - ".github/workflows/control-center-a6-pwa-parity.yml"
permissions:
  contents: write
jobs:
  synchronize-v03-visual-baselines:
    if: github.event.pull_request.number == 275 && github.event.pull_request.head.ref == 'feat/trama-ecosystem-state-v0.3' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Regenerate reviewed A6 visual baselines
        run: npx playwright test e2e/a6-visual.spec.ts --update-snapshots
      - name: Enforce reviewed baseline allowlist
        shell: bash
        run: |
          set -euo pipefail
          cd ../..
          git diff --name-only -- apps/control-center/e2e/a6-visual.spec.ts-snapshots > /tmp/a6-changed.txt
          cat > /tmp/a6-allowed.txt <<'EOF'
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-desktop-linux.png
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-phone-linux.png
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-lim-linux.png
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-reflow-320-linux.png
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/evidence-desktop-linux.png
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/evidence-phone-linux.png
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/evidence-lim-linux.png
          apps/control-center/e2e/a6-visual.spec.ts-snapshots/evidence-reflow-320-linux.png
          EOF
          sort -u /tmp/a6-changed.txt -o /tmp/a6-changed.txt
          sort -u /tmp/a6-allowed.txt -o /tmp/a6-allowed.txt
          diff -u /tmp/a6-allowed.txt /tmp/a6-changed.txt
          echo "TRAMA_V03_VISUAL_BASELINE_ALLOWLIST_PASS"
      - name: Commit reviewed visual baselines
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-center/e2e/a6-visual.spec.ts-snapshots/*.png
          if git diff --cached --quiet; then
            echo "TRAMA_V03_VISUAL_BASELINES_ALREADY_CURRENT"
            exit 0
          fi
          git commit -m "test(control-center): materialize reviewed v0.3 visual baselines"
          git push origin "HEAD:${HEAD_REF}"

  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Build candidate
        run: npm run build
      - name: Bundle report
        run: node scripts/report-bundle-size.mjs > a6-bundle-report.json
      - name: Enforce A6 PWA and bundle guardrails
        run: node scripts/check-a6-bundle-budget.mjs a6-bundle-report.json
      - name: Verify CSP-compatible static output
        run: |
          test -s dist/sw.js
          test -s dist/manifest.json
          ! grep -R -E "(api\.github\.com|raw\.githubusercontent\.com|GITHUB_TOKEN|Authorization: Bearer|dangerouslySetInnerHTML|eval\()" src
          ! grep -E '<script(>|[^>]*>)[[:space:]]*[^<]' dist/index.html
          ! grep -R -E 'new Function\(|eval\(' dist/assets/*.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: A6 browser PWA parity qualification
        run: npx playwright test e2e/a6-pwa-parity.spec.ts
      - name: A6 visual regression
        run: npx playwright test e2e/a6-visual.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-a6-pwa-parity-${{ github.event.pull_request.head.sha }}
          path: |
            apps/control-center/a6-bundle-report.json
            apps/control-center/test-results
            apps/control-center/playwright-report
          if-no-files-found: warn
