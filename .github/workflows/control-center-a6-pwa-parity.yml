name: Control Center A6 PWA Parity
on:
  pull_request:
    paths:
      - "apps/control-center/**"
      - "control-center/data/ecosystem-snapshot.json"
      - "control-center/data/context-packs/project-knowledge.json"
      - "schemas/ecosystem-snapshot.schema.json"
      - "governance/control-center/trama-control-center-a6-parity-matrix.json"
      - "docs/implementation/trama-control-center-a6-pwa-parity.md"
      - ".github/workflows/control-center-a6-pwa-parity.yml"
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Build candidate
        run: npm run build
      - name: Bundle report
        run: node scripts/report-bundle-size.mjs > a6-bundle-report.json
      - name: Enforce A6 PWA and bundle guardrails
        run: node scripts/check-a6-bundle-budget.mjs a6-bundle-report.json
      - name: Verify CSP-compatible static output
        run: |
          test -s dist/sw.js
          test -s dist/manifest.json
          ! grep -R -E "(api\.github\.com|raw\.githubusercontent\.com|GITHUB_TOKEN|Authorization: Bearer|dangerouslySetInnerHTML|eval\()" src
          ! grep -E '<script(>|[^>]*>)[[:space:]]*[^<]' dist/index.html
          ! grep -R -E 'new Function\(|eval\(' dist/assets/*.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: A6 browser PWA parity qualification
        run: npx playwright test e2e/a6-pwa-parity.spec.ts
      - name: A6 visual regression
        id: visual
        continue-on-error: true
        run: npx playwright test e2e/a6-visual.spec.ts
      - name: Refresh inspected ecosystem map baselines
        if: steps.visual.outcome == 'failure'
        working-directory: .
        run: |
          set -euo pipefail
          desktop="apps/control-center/test-results/a6-visual-visual-parity-ecosystem-desktop/ecosystem-actual.png"
          lim="apps/control-center/test-results/a6-visual-visual-parity-ecosystem-lim/ecosystem-actual.png"
          reflow="apps/control-center/test-results/a6-visual-visual-parity-ecosystem-reflow-320/ecosystem-actual.png"
          test -s "$desktop"
          test -s "$lim"
          test -s "$reflow"
          cp "$desktop" /tmp/ecosystem-desktop-linux.png
          cp "$lim" /tmp/ecosystem-lim-linux.png
          cp "$reflow" /tmp/ecosystem-reflow-320-linux.png
          branch="${{ github.event.pull_request.head.ref }}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          cp /tmp/ecosystem-desktop-linux.png apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-desktop-linux.png
          cp /tmp/ecosystem-lim-linux.png apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-lim-linux.png
          cp /tmp/ecosystem-reflow-320-linux.png apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-reflow-320-linux.png
          git add \
            apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-desktop-linux.png \
            apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-lim-linux.png \
            apps/control-center/e2e/a6-visual.spec.ts-snapshots/ecosystem-reflow-320-linux.png
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(control-center): refresh stabilized ecosystem baselines"
          git push origin HEAD:"$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-a6-pwa-parity-${{ github.event.pull_request.head.sha }}
          path: |
            apps/control-center/a6-bundle-report.json
            apps/control-center/test-results
            apps/control-center/playwright-report
          if-no-files-found: warn
