name: TRAMA Public Anonymous Read-Only Source
on:
  pull_request:
    paths:
      - 'scripts/cc_mss_readonly_credential_source.py'
      - 'scripts/test_cc_mss_readonly_credential_source.py'
      - 'docs/control-center/CC-MSS-01-READ-ONLY-CREDENTIAL-SOURCE-01.md'
      - 'config/repository-enrollment.json'
      - '.github/workflows/readonly-credential-source.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_cc_mss_readonly_credential_source.py
      - name: Capability audit
        run: |
          ! grep -En 'os\.environ|dotenv|subprocess|requests\.|httpx\.|urllib|socket|Authorization.*Bearer|github-app-installation|ghp_|github_pat_' scripts/cc_mss_readonly_credential_source.py
          grep -q 'PUBLIC_ANONYMOUS' scripts/cc_mss_readonly_credential_source.py
          grep -q 'authorizationHeader":"ABSENT"' scripts/cc_mss_readonly_credential_source.py
