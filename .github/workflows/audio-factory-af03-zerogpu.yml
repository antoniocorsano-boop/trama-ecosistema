name: Audio Factory AF-03 - Italian Qwen3 public ZeroGPU trial

on:
  pull_request:
    types: [labeled]
    branches: [feat/audio-factory-af01-kokoro-pilot]

permissions:
  contents: read

concurrency:
  group: af03-public-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qwen3-public-demo:
    if: >-
      github.event.pull_request.number == 304 &&
      github.event.label.name == 'af03-demo-autorizzato' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/audio-factory-af03-qwen3-prosody'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TRAMA_AF03_PUBLIC_DEMO_AUTHORIZED: "yes"
    steps:
      - name: Checkout fixed PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate inputs and run offline tests
        run: |
          python services/audio-factory/af03_public_demo.py --validate-only
          python -m unittest discover -s services/audio-factory/tests -p 'test_*.py' -q
      - name: Install lightweight public API client
        timeout-minutes: 2
        run: |
          python -m pip install --disable-pip-version-check --timeout 20 --retries 0 "gradio_client>=1.13,<3"
      - name: Attempt at most two anonymous free ZeroGPU samples
        timeout-minutes: 6
        run: |
          python services/audio-factory/af03_public_demo.py --output af03-public-demo
      - name: Preserve candidate audio or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af03-qwen3-italian-public-demo
          path: af03-public-demo/
          if-no-files-found: warn
          retention-days: 3
