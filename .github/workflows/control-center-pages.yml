name: Validate TRAMA Control Center

on:
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-pages.yml"
  push:
    branches: ["main"]
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "trama-control-center-validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate static dashboard contract
        shell: bash
        run: |
          set -euo pipefail
          test -s control-center/index.html
          test -s control-center/ecosystem.html
          test -s control-center/manifest.webmanifest
          test -s control-center/sw.js
          test -s control-center/icons/icon-192.svg
          test -s control-center/icons/icon-512.svg
          grep -q "TRAMA Control Center" control-center/index.html
          grep -q "SOLA LETTURA" control-center/index.html
          test -s control-center/data/ecosystem-snapshot.json
          grep -q "SNAPSHOT_URL='./data/ecosystem-snapshot.json'" control-center/index.html
          grep -q "Matrice di maturità" control-center/index.html
          grep -q "Attenzione richiesta" control-center/index.html
          grep -q "Ecosistema vivo" control-center/index.html
          grep -q "ecosystem.html" control-center/index.html
          grep -q "Capability e mappa dell’ecosistema" control-center/ecosystem.html
          grep -q "capabilityList" control-center/ecosystem.html
          grep -q "relationList" control-center/ecosystem.html
          grep -q "mapEdges" control-center/ecosystem.html
          grep -q "aria-label=\"Elenco equivalente delle relazioni\"" control-center/ecosystem.html
          grep -q "Evidenze disponibili" control-center/index.html
          grep -q "Stakeholder Assurance" control-center/index.html
          grep -q "data-help-title" control-center/index.html
          grep -q "helpPopover" control-center/index.html
          grep -q "helpAttr(claim.requirementId" control-center/index.html
          grep -q "'assurance-card'" control-center/index.html
          grep -q "'area'" control-center/index.html
          grep -q "'alert'" control-center/index.html
          grep -q "'dep'" control-center/index.html
          grep -q "'exp-item'" control-center/index.html
          grep -q "'ev'" control-center/index.html
          grep -q "reports/stakeholder-assurance.html" control-center/index.html
          test -s control-center/reports/stakeholder-assurance.html
          test -s control-center/reports/stakeholder-assurance.md
          grep -q "manifest.webmanifest" control-center/index.html
          grep -q "serviceWorker" control-center/index.html
          grep -q '"display": "standalone"' control-center/manifest.webmanifest
          grep -q "max-width:700px" control-center/index.html
          grep -q "mobile-overview" control-center/index.html
          grep -q "mobilePhaseCount" control-center/index.html
          grep -q "mobileAssuranceGapCount" control-center/index.html
          grep -q "phase:not(.is-active)" control-center/index.html
          grep -q "scroll-snap-type:x mandatory" control-center/index.html
          grep -q "min-height:44px" control-center/index.html
          grep -q "bottom:84px" control-center/index.html
          grep -q "prefers-reduced-motion:reduce" control-center/index.html
          grep -q "aria-live=\"polite\"" control-center/index.html
          grep -q "focusin" control-center/index.html
          grep -q "mobile-nav" control-center/index.html
          grep -q "Offline · ultimo snapshot locale" control-center/index.html
          grep -q "request.mode==='navigate'" control-center/sw.js
          grep -q "networkFirst(request,'./index.html')" control-center/sw.js
          grep -q "trama-control-center-v6" control-center/sw.js
          grep -q "\./ecosystem.html" control-center/sw.js
          grep -q "controllerchange" control-center/index.html
          grep -q "overflow-x:hidden" control-center/index.html
          grep -q "overscroll-behavior-inline:contain" control-center/index.html
          grep -q "clampHorizontalViewport" control-center/index.html
          grep -q "phasePagination" control-center/index.html
          grep -q "scrollbar-width:none" control-center/index.html
          grep -q "width:44px;height:44px" control-center/index.html
          ! grep -q "margin:0 -12px" control-center/index.html
          ! grep -q "margin:0 -13px" control-center/index.html
          if grep -Eq "(api\.github\.com|raw\.githubusercontent\.com)" control-center/index.html; then
            echo "Direct GitHub fetch found in snapshot-first shell" >&2
            exit 1
          fi
          if grep -Eq "(ghp_|github_pat_|Authorization:|Bearer )" control-center/index.html; then
            echo "Secret-like token or authorization header found in static dashboard" >&2
            exit 1
          fi
      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          for (const file of ['control-center/index.html','control-center/ecosystem.html']) {
            const html = fs.readFileSync(file, 'utf8')
            const match = html.match(/<script>([\s\S]*?)<\/script>/)
            if (!match) throw new Error('Inline script not found in '+file)
            new Function(match[1])
            console.log('CONTROL_CENTER_JS_SYNTAX_PASS '+file)
          }
          const sw = fs.readFileSync('control-center/sw.js', 'utf8')
          new Function(sw)
          console.log('CONTROL_CENTER_SW_SYNTAX_PASS')
          NODE

