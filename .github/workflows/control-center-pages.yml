name: Validate TRAMA Control Center

on:
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-pages.yml"
  push:
    branches: ["main"]
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "trama-control-center-validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate static dashboard contract
        shell: bash
        run: |
          set -euo pipefail
          test -s control-center/index.html
          test -s control-center/manifest.webmanifest
          test -s control-center/sw.js
          test -s control-center/icons/icon-192.svg
          test -s control-center/icons/icon-512.svg
          grep -q "TRAMA Control Center" control-center/index.html
          grep -q "SOLA LETTURA" control-center/index.html
          test -s control-center/data/ecosystem-snapshot.json
          grep -q "SNAPSHOT_URL='./data/ecosystem-snapshot.json'" control-center/index.html
          grep -q "Matrice di maturità" control-center/index.html
          grep -q "Attenzione richiesta" control-center/index.html
          grep -q "Ecosistema vivo" control-center/index.html
          grep -q "Evidenze disponibili" control-center/index.html
          grep -q "manifest.webmanifest" control-center/index.html
          grep -q "serviceWorker" control-center/index.html
          grep -q '"display": "standalone"' control-center/manifest.webmanifest
          grep -q "pointer:coarse" control-center/index.html
          grep -q "max-width:980px" control-center/index.html
          grep -q "mobile-nav" control-center/index.html
          grep -q "Offline · ultimo snapshot locale" control-center/index.html
          if grep -Eq "(api\.github\.com|raw\.githubusercontent\.com)" control-center/index.html; then
            echo "Direct GitHub fetch found in snapshot-first shell" >&2
            exit 1
          fi
          if grep -Eq "(ghp_|github_pat_|Authorization:|Bearer )" control-center/index.html; then
            echo "Secret-like token or authorization header found in static dashboard" >&2
            exit 1
          fi
      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('control-center/index.html', 'utf8')
          const match = html.match(/<script>([\s\S]*?)<\/script>/)
          if (!match) throw new Error('Inline script not found')
          new Function(match[1])
          console.log('CONTROL_CENTER_JS_SYNTAX_PASS')
          const sw = fs.readFileSync('control-center/sw.js', 'utf8')
          new Function(sw)
          console.log('CONTROL_CENTER_SW_SYNTAX_PASS')
          NODE

