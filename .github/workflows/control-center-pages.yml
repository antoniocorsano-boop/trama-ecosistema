name: Validate TRAMA Control Center

on:
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-pages.yml"
  push:
    branches: ["main"]
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "trama-control-center-validate-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate static dashboard contract
        shell: bash
        run: |
          set -euo pipefail
          test -s control-center/index.html
          grep -q "TRAMA Control Center" control-center/index.html
          grep -q "SOLA LETTURA" control-center/index.html
          grep -q "api.github.com" control-center/index.html
          if grep -Eq "(ghp_|github_pat_|Authorization:|Bearer )" control-center/index.html; then
            echo "Secret-like token or authorization header found in static dashboard" >&2
            exit 1
          fi
      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('control-center/index.html', 'utf8')
          const match = html.match(/<script>([\s\S]*?)<\/script>/)
          if (!match) throw new Error('Inline script not found')
          new Function(match[1])
          console.log('CONTROL_CENTER_JS_SYNTAX_PASS')
          NODE
