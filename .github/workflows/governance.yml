name: Governance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - {name: Install governed M1-A HTTP dependency, run: python3 -m pip install --disable-pip-version-check "httpx==0.28.1"}
      - {name: Validate governance, run: python3 scripts/validate_governance.py}
      - {name: Validate governed document registry, run: python3 scripts/validate_governed_document_registry.py}
      - {name: Validate OR-06 cross-ecosystem read-only proof, run: python3 scripts/validate_or06_cross_ecosystem_readonly_proof.py}
      - {name: Test OR-06 cross-ecosystem read-only proof, run: python3 -m unittest tests.test_or06_cross_ecosystem_readonly_proof -v}
      - {name: Validate OR-07 shared capability layer, run: python3 scripts/validate_or07_shared_capability_layer.py}
      - {name: Test OR-07 shared capability layer, run: python3 -m unittest tests.test_or07_shared_capability_layer -v}
      - {name: Validate OR-08 runtime portability, run: python3 scripts/validate_or08_runtime_portability.py}
      - {name: Test OR-08 runtime portability, run: python3 -m unittest tests.test_or08_runtime_portability -v}
      - {name: Validate OR-09 execution readiness, run: python3 scripts/validate_or09_execution_readiness.py}
      - {name: Test OR-09 execution readiness, run: python3 -m unittest tests.test_or09_execution_readiness -v}
      - {name: Validate OR-10 product evidence alignment, run: python3 scripts/validate_or10_product_evidence_alignment.py}
      - {name: Validate QE-01 execution profile, run: python3 scripts/validate_qe01_execution_profile.py}
      - {name: Run QE-01 adversarial tests, run: python3 -m unittest tests.test_qe01_execution_profile -v}
      - {name: Validate QE-01 provider qualification, run: python3 scripts/validate_qe01_provider_qualification.py}
      - {name: Run QE-01 provider qualification adversarial tests, run: python3 -m unittest tests.test_qe01_provider_qualification -v}
      - {name: Validate QE-01 pre-live gates, run: python3 scripts/validate_qe01_pre_live_gates.py}
      - {name: Run QE-01 pre-live adversarial tests, run: python3 -m unittest tests.test_qe01_pre_live_gates -v}
      - {name: Run QE-01 credential probe offline tests, run: python3 -m unittest tests.test_qe01_credential_probe -v}
      - {name: Test QE-01 DSH read-only observation collector, run: python3 -m unittest tests.test_qe01_dsh_observation -v}
      - {name: Validate Control Center A0 architecture lock, run: python3 scripts/validate_control_center_a0_architecture_lock.py}
      - {name: Validate Stage E1 visual prototype, run: python3 scripts/validate_stage_e1_visual_prototype.py}
      - {name: Test Stage E2 project knowledge UI mapping, run: node scripts/test_stage_e2_project_knowledge_ui.cjs}
      - {name: Validate Stage E3 human-use catalog, run: python3 scripts/validate_stage_e3_human_use.py}
      - {name: Validate Stage E3 public human-use surface, run: node scripts/test_stage_e3_public_validation_surface.cjs}
      - {name: Validate Control Center L0 realistic prototype, run: python3 scripts/validate_control_center_l0_realistic_prototype.py}
      - {name: Validate Control Center L0 Render preview, run: python3 scripts/validate_control_center_l0_render_preview.py}
      - {name: Validate Stage E3-L0 human-use surface, run: python3 scripts/validate_stage_e3_l0.py}
      - {name: Validate TRAMA UI development model, run: python3 scripts/validate_trama_ui_development_model.py}
      - {name: Validate TRAMA component strategy, run: python3 scripts/validate_trama_component_strategy.py}
      - {name: Validate TRAMA component inventory, run: python3 scripts/validate_trama_component_inventory.py}
      - {name: Validate TRAMA component INV-01, run: python3 scripts/validate_trama_component_inv01.py}
      - {name: Validate TRAMA component INV-02, run: python3 scripts/validate_trama_component_inv02.py}
      - {name: Validate TRAMA component INV-03, run: python3 scripts/validate_trama_component_inv03.py}
      - {name: Validate TRAMA component evidence registry, run: python3 scripts/validate_trama_component_evidence_registry.py}
      - {name: Qualify CC-MSS-01 Stage B offline matrix, run: python3 scripts/qualify_cc_mss_stage_b.py}
      - {name: Audit CC-MSS-01 Stage C1 mutation surface, run: python3 scripts/audit_cc_mss_stage_c1_surface.py}
      - {name: Qualify CC-MSS-01 Stage C1 offline fixtures with network guard, run: python3 scripts/qualify_cc_mss_stage_c1.py}
      - {name: Run CC-MSS-01 Stage C1 adversarial tests, run: python3 -m unittest tests.test_cc_mss_stage_c1_adversarial -v}
      - {name: Audit CC-MSS-01 Stage C2 pre-live capability surface, run: python3 scripts/audit_cc_mss_stage_c2_surface.py}
      - {name: Qualify CC-MSS-01 Stage C2 pre-live offline fixtures with network guard, run: python3 scripts/qualify_cc_mss_stage_c2_pre_live.py}
      - {name: Run CC-MSS-01 Stage C2 adversarial tests, run: python3 -m unittest tests.test_cc_mss_stage_c2_adversarial -v}
      - {name: Audit CC-MSS-01 Stage C2 live-probe simulation surface, run: python3 scripts/audit_cc_mss_stage_c2_live_sim_surface.py}
      - {name: Run C2 live-sim audit adversarial tests, run: python3 -m unittest tests.test_cc_mss_stage_c2_live_sim_audit_adversarial -v}
      - {name: Run CC-MSS-01 Stage C2 live-probe offline simulation, run: python3 -m unittest tests.test_cc_mss_stage_c2_live_probe_sim -v}
      - {name: Audit CC-MSS-01 Stage C2 Adapter M0 inert surface, run: python3 scripts/audit_cc_mss_stage_c2_adapter_m0.py}
      - {name: Run CC-MSS-01 Stage C2 Adapter M0 audit adversarial tests, run: python3 -m unittest tests.test_cc_mss_stage_c2_adapter_m0_audit -v}
      - {name: Run CC-MSS-01 Stage C2 Adapter M0 qualification, run: python3 -m unittest tests.test_cc_mss_stage_c2_adapter_m0 -v}
      - {name: Audit CC-MSS-01 Stage C2 Adapter M1-A capability surface, run: python3 scripts/audit_cc_mss_stage_c2_adapter_m1a.py}
      - {name: Run CC-MSS-01 Stage C2 Adapter M1-A audit adversarial tests, run: python3 -m unittest tests.test_cc_mss_stage_c2_adapter_m1a_audit -v}
      - {name: Run CC-MSS-01 Stage C2 Adapter M1-A offline qualification, run: python3 -m unittest tests.test_cc_mss_stage_c2_adapter_m1a -v}
      - {name: Audit CC-MSS-01 Stage C2 Adapter M1-B offline surface, run: python3 scripts/audit_cc_mss_stage_c2_adapter_m1b.py}
      - {name: Run CC-MSS-01 Stage C2 Adapter M1-B audit adversarial tests, run: python3 -m unittest tests.test_cc_mss_stage_c2_adapter_m1b_audit -v}
      - {name: Run CC-MSS-01 Stage C2 Adapter M1-B offline qualification, run: python3 -m unittest tests.test_cc_mss_stage_c2_adapter_m1b -v}
      - {name: Validate CC-MSS-01 LIVE_ONE_SHOT decision package fail-closed, run: python3 scripts/validate_cc_mss_live_decision_package.py}
      - {name: Run CC-MSS-01 LIVE_ONE_SHOT decision package adversarial tests, run: python3 -m unittest tests.test_cc_mss_live_decision_package -v}
      - {name: Audit CC-MSS-01 LIVE_ONE_SHOT binding materializer offline surface, run: python3 scripts/audit_cc_mss_live_binding_materializer.py}
      - {name: Run CC-MSS-01 LIVE_ONE_SHOT binding materializer adversarial tests, run: python3 -m unittest tests.test_cc_mss_live_binding_materializer -v}
      - {name: Validate TRAMA Control Center GitHub App profile, run: python3 scripts/validate_trama_control_center_github_app_profile.py}
      - {name: Run TRAMA Control Center GitHub App profile adversarial tests, run: python3 -m unittest tests.test_trama_control_center_github_app_profile -v}
      - {name: Audit CC-MSS-01 Actions ephemeral provider offline surface, run: python3 scripts/audit_cc_mss_actions_ephemeral_provider.py}
      - {name: Validate CC-MSS-01 Actions ephemeral provider profile, run: python3 scripts/validate_cc_mss_actions_ephemeral_provider.py}
      - {name: Run CC-MSS-01 Actions ephemeral provider adversarial tests, run: python3 -m unittest tests.test_cc_mss_actions_ephemeral_provider -v}
      - {name: Validate component and pattern Stage A, run: node scripts/validate-component-pattern-stage-a.mjs}
      - {name: Validate component and pattern Stage A.1 coverage, run: node scripts/validate-component-pattern-stage-a1.mjs}
      - {name: Validate component and pattern Stage A.2 qualification, run: node scripts/validate-component-pattern-stage-a2.mjs}
      - {name: Validate ERROR_RECOVERY Stage A.2 qualification, run: node scripts/validate-error-recovery-stage-a2.mjs}
      - {name: Validate LOADING_PENDING_PROGRESS Stage A.2 qualification, run: node scripts/validate-loading-pending-progress-stage-a2.mjs}
      - {name: Validate REVIEW_DECIDE_CONFIRM Stage A.2 qualification, run: node scripts/validate-review-decide-confirm-stage-a2.mjs}
      - {name: Run tests, run: python3 -m unittest discover -s tests -v}
