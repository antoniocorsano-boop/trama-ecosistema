name: Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governance
        run: python3 scripts/validate_governance.py
      - name: Validate component and pattern Stage A
        run: node scripts/validate-component-pattern-stage-a.mjs
      - name: Validate component and pattern Stage A.1 coverage
        run: node scripts/validate-component-pattern-stage-a1.mjs
      - name: Validate component and pattern Stage A.2 qualification
        run: node scripts/validate-component-pattern-stage-a2.mjs
      - name: Validate ERROR_RECOVERY Stage A.2 qualification
        run: node scripts/validate-error-recovery-stage-a2.mjs
      - name: Validate LOADING_PENDING_PROGRESS Stage A.2 qualification
        run: node scripts/validate-loading-pending-progress-stage-a2.mjs
      - name: Validate REVIEW_DECIDE_CONFIRM Stage A.2 qualification
        run: node scripts/validate-review-decide-confirm-stage-a2.mjs
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
