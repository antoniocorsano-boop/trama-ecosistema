name: AF-12 - Missione 118 V9 selective correction and rhythm
on:
  pull_request:
    types: [synchronize, labeled, opened, reopened]
    branches: [feat/audio-factory-af03-qwen3-prosody]
permissions:
  contents: read
  actions: read
concurrency:
  group: af12-v9-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.event.pull_request.number == 312 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/af10-missione118-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline tests
        run: python -m unittest discover -s services/audio-factory/tests -p 'test_*.py' -q
  candidate:
    needs: qualify
    if: >-
      github.event.action == 'labeled' &&
      github.event.repository.private == false &&
      github.event.pull_request.number == 312 &&
      github.event.label.name == format('af12-{0}', github.event.pull_request.head.sha) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/af10-missione118-v9' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve original AF11 candidate
        uses: actions/download-artifact@v4
        with:
          name: af11-missione118-v9
          run-id: 43486156318
          github-token: ${{ github.token }}
          path: source
      - name: Verify AF11 receipt and every original unit
        run: |
          PYTHONPATH=services/audio-factory python -c "from pathlib import Path; from af12_v9_rhythm import verified_source; assert len(verified_source(Path('source')))==14"
      - name: Install qualified CPU synthesis dependencies
        timeout-minutes: 8
        run: |
          python -m pip install --disable-pip-version-check --retries 1 --timeout 20 --only-binary=:all: -r services/audio-factory/requirements-kokoro.txt
      - name: Generate one unit and assemble original PCM with shorter pauses
        timeout-minutes: 8
        run: python services/audio-factory/af12_v9_rhythm.py --output af12-v9 --source source
      - name: Install independent ASR
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --retries 0 "faster-whisper==1.2.1" "ctranslate2==4.9.0"
      - name: Blind lexical review of all five scenes
        timeout-minutes: 6
        run: python services/audio-factory/af12_v9_rhythm.py --output af12-v9 --asr
      - name: Preserve candidate and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af12-missione118-v9
          path: af12-v9/
          if-no-files-found: warn
          retention-days: 7
