name: PR92 Align ECO-02 State

on:
  push:
    paths:
      - ".github/workflows/pr92-align-eco02-state.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/universal-didactic-planning-v1
      - name: Align historical ECO-02 references
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path("docs/architecture/trama-universal-didactic-planning-artifact-orchestration-v1.md")
          s = p.read_text()
          old = '''## 16. Protected work in progress

Questa proposta non deve interferire con:

- ECO-02/P1;
- PR aperte necessarie al collaudo;
- Lesson Workspace in validazione;
- apertura dei materiali nel percorso reale;
- stato R3-P4;
- stato DOS-A1;
- CC3;
- autorizzazioni runtime correnti.

In particolare, fino alla chiusura del pilota ECO-02/P1, le modifiche a:

- "Prima della lezione";
- decisione materiali;
- Lesson Workspace;
- collegamenti materiali;
- TeachingSession;

devono essere considerate ad alto rischio di collisione e richiedono un gate separato.'''
          new = '''## 16. Protected work and closed-pilot baseline

ECO-02/P1 è **CLOSED / HUMAN PASS** e costituisce una baseline validata da preservare. Questa proposta non riapre il pilota e non modifica il runtime validato.

La proposta non deve interferire con:

- baseline e invarianti validati da ECO-02/P1;
- eventuali PR ancora aperte con gate umani propri;
- stato R3-P4;
- stato DOS-A1;
- CC3;
- autorizzazioni runtime correnti.

Eventuali modifiche future a:

- "Prima della lezione";
- decisione materiali;
- Lesson Workspace;
- collegamenti materiali;
- TeachingSession;

devono preservare gli esiti validati di ECO-02/P1 e, quando incidono sul runtime o sui relativi invarianti, essere trattate mediante un gate separato.'''
          if old not in s:
              raise SystemExit("Expected section 16 not found; refusing partial rewrite")
          s = s.replace(old, new, 1)
          s = s.replace('11. non modifica il runtime ECO-02 durante il collaudo;', '11. non riapre né altera il runtime e gli invarianti validati da ECO-02/P1;', 1)
          s = s.replace('- `STATUS.md` — ECO-02/P1 ACTIVE, R4-P1 PLANNED / NO_RUNTIME, R3-P4 NOT AUTHORIZED, DOS-A1 RUNTIME_DEFERRED;', '- `STATUS.md` — ECO-02/P1 CLOSED / HUMAN PASS, R4-P1 PLANNED / NO_RUNTIME, R3-P4 NOT AUTHORIZED, DOS-A1 RUNTIME_DEFERRED;', 1)
          p.write_text(s)
      - name: Commit alignment
        shell: bash
        run: |
          git diff --check
          git diff --exit-code --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/trama-universal-didactic-planning-artifact-orchestration-v1.md
          git commit -m "docs: align universal planning spec after ECO-02 closure"
          git push origin HEAD:docs/universal-didactic-planning-v1
