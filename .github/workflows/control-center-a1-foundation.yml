name: Control Center A1 Foundation
on:
  pull_request:
    paths:
      - "apps/control-center/**"
      - "schemas/ecosystem-snapshot.schema.json"
      - "control-center/data/ecosystem-snapshot.json"
      - "control-center/data/context-packs/project-knowledge.json"
      - ".github/workflows/control-center-a1-foundation.yml"
      - "docs/implementation/trama-control-center-a1-foundation.md"
      - "docs/strategy/trama-control-center-modular-app-migration-a0-a7.md"
      - "docs/knowledge/governed-document-registry.json"
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Build candidate
        run: npm run build
      - name: Bundle report
        run: npm run build:report > a1-bundle-report.json
      - name: Verify governed artifacts emitted
        run: |
          test -s dist/data/ecosystem-snapshot.json
          test -s dist/data/context-packs/project-knowledge.json
          ! grep -R -E "(api\.github\.com|raw\.githubusercontent\.com|GITHUB_TOKEN|Authorization: Bearer)" src
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:e2e -- --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-a1-foundation-${{ github.event.pull_request.head.sha }}
          path: |
            apps/control-center/a1-bundle-report.json
            apps/control-center/playwright-report
          if-no-files-found: warn
