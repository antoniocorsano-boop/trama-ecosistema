name: Control Center A1 Foundation
on:
  pull_request:
    paths:
      - "apps/control-center/**"
      - "schemas/ecosystem-snapshot.schema.json"
      - "control-center/data/ecosystem-snapshot.json"
      - "control-center/data/context-packs/project-knowledge.json"
      - ".github/workflows/control-center-a1-foundation.yml"
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect committed lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap deterministic lockfile
        if: steps.lock.outputs.missing == 'true'
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --save-dev --save-exact jsdom@latest @types/node@latest --ignore-scripts
      - name: Persist bootstrap lockfile to PR branch
        if: steps.lock.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "A1: persist deterministic npm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Install from generated lockfile
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Build candidate
        run: npm run build
      - name: Bundle report
        run: npm run build:report > a1-bundle-report.json
      - name: Verify governed artifacts emitted
        run: |
          test -s dist/data/ecosystem-snapshot.json
          test -s dist/data/context-packs/project-knowledge.json
          ! grep -R -E "(api\.github\.com|raw\.githubusercontent\.com|GITHUB_TOKEN|Authorization: Bearer)" src
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: npm run test:e2e -- --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-a1-foundation-${{ github.event.pull_request.head.sha }}
          path: |
            apps/control-center/a1-bundle-report.json
            apps/control-center/package.json
            apps/control-center/package-lock.json
            apps/control-center/playwright-report
          if-no-files-found: warn
