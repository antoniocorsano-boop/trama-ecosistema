name: Audit v1.4 Project Knowledge fix

on:
  push:
    branches:
      - docs/audit-v1-4-live-visual-proof
    paths:
      - .github/workflows/audit-v1-4-project-knowledge-fix.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/audit-v1-4-live-visual-proof
          fetch-depth: 0
      - name: Fix project-knowledge selector source
        run: python scripts/audit_v1_4_project_knowledge_fix.py
      - name: Regenerate governed projections
        run: |
          python scripts/build_ecosystem_snapshot.py --output control-center/data/ecosystem-snapshot.json
          python scripts/build_project_context_snapshot.py --output control-center/data/project-context-snapshot.json
          python scripts/build_trama_context_pack.py project-knowledge \
            --snapshot control-center/data/project-context-snapshot.json \
            --output control-center/data/context-packs/project-knowledge.json
      - name: Commit permanent delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trama-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add status/project-knowledge-events.json \
            control-center/data/ecosystem-snapshot.json \
            control-center/data/project-context-snapshot.json \
            control-center/data/context-packs/project-knowledge.json
          git commit -m 'fix: project Audit v1.4 into Project Knowledge'
          git push origin HEAD:docs/audit-v1-4-live-visual-proof
