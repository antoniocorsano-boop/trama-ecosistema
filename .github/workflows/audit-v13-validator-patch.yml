name: Audit v1.3 snapshot validator patch

on:
  push:
    branches:
      - docs/audit-v1-3-studio-atlas-baseline
    paths:
      - .github/workflows/audit-v13-validator-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch conservative maturity wiring assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/control-center-snapshot.yml')
          text = path.read_text(encoding='utf-8')
          old_expected = 'expected = {"governance", "arena", "atlas", "docente-os"}'
          new_expected = 'expected = {"governance", "arena", "atlas", "docente-os", "studio-atlas"}'
          if old_expected not in text:
              raise SystemExit('expected area-set anchor not found')
          text = text.replace(old_expected, new_expected, 1)
          anchor = '          assert areas["docente-os"]["nextRequiredEvidenceTypes"] == ["RUNTIME_CANARY"], areas["docente-os"]\n'
          insertion = (
              anchor
              + '          assert areas["studio-atlas"]["confirmedLevel"] == 1, areas["studio-atlas"]\n'
              + '          assert areas["studio-atlas"]["candidateLevel"] == 1, areas["studio-atlas"]\n'
              + '          assert areas["studio-atlas"]["nextTargetLevel"] == 2, areas["studio-atlas"]\n'
              + '          assert areas["studio-atlas"]["nextRequiredEvidenceTypes"] == ["CONTRACT_APPROVED"], areas["studio-atlas"]\n'
              + '          assert not any(\n'
              + '              item.get("area") == "studio-atlas" and item.get("type") != "DOCUMENT_CANONICAL"\n'
              + '              for item in snapshot["evidence"]\n'
              + '          ), snapshot["evidence"]\n'
          )
          if anchor not in text:
              raise SystemExit('Studio Atlas assertion insertion anchor not found')
          text = text.replace(anchor, insertion, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit validator update
        run: |
          git config user.name 'trama-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/control-center-snapshot.yml
          git commit -m 'test: validate Studio Atlas conservative maturity wiring'
          git push origin HEAD:docs/audit-v1-3-studio-atlas-baseline
