name: TRAMA Public Anonymous LIVE_ONE_SHOT
on:
  workflow_dispatch:
jobs:
  live-one-shot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      HTTPS_PROXY: ""
      HTTP_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline transport qualification
        run: python scripts/test_public_anonymous_transport.py
      - name: Run anonymous one-shot collector
        run: python scripts/run_public_anonymous_repository_observation.py --output control-center/data/repository-observation.live.json
      - name: Validate RepositoryObservation schema
        run: |
          python -m pip install jsonschema
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator,FormatChecker
          s=json.load(open('schemas/repository-observation.schema.json'))
          d=json.load(open('control-center/data/repository-observation.live.json'))
          errors=list(Draft202012Validator(s,format_checker=FormatChecker()).iter_errors(d))
          assert not errors,[e.message for e in errors]
          print('REPOSITORY_OBSERVATION_SCHEMA_PASS')
          PY
      - name: Build ProjectContextSnapshot from live observation
        run: |
          python scripts/build_project_context_snapshot.py --repository-observation control-center/data/repository-observation.live.json --output control-center/data/project-context-snapshot.live.json
          python - <<'PY'
          import json
          d=json.load(open('control-center/data/project-context-snapshot.live.json'))
          assert d['status']=='CURRENT',d['status']
          print('PROJECT_CONTEXT_CURRENT_PASS')
          PY
      - name: Emit non-secret evidence summary
        run: |
          python - <<'PY'
          import json
          o=json.load(open('control-center/data/repository-observation.live.json'))
          s=json.load(open('control-center/data/project-context-snapshot.live.json'))
          print(json.dumps({
            'collectionId':o['collectionId'],
            'observedAt':o['observedAt'],
            'status':o['status'],
            'repositories':[{'repository':r['repository'],'observedHead':r['observedHead']} for r in o['repositories']],
            'openPullRequests':len(o['pullRequests']),
            'projectContextStatus':s['status']
          },sort_keys=True))
          PY
