name: AF-08 - Missione 118 V7 production candidate
on:
  pull_request:
    types: [labeled]
    branches: [feat/audio-factory-af01-kokoro-pilot]
permissions:
  contents: read
concurrency:
  group: af08-v7-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  production:
    if: >-
      github.event.repository.private == false &&
      github.event.pull_request.number == 304 &&
      github.event.label.name == 'af08-v7-produzione-autorizzata' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/audio-factory-af03-qwen3-prosody' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      CARGO_BUILD_JOBS: "4"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline tests and exact script verification
        run: python -m unittest discover -s services/audio-factory/tests -p 'test_*.py' -q
      - name: Build pinned CPU engine
        timeout-minutes: 14
        run: |
          git clone --filter=blob:none https://github.com/cartesia-one/csm.rs.git "$RUNNER_TEMP/csm"
          git -C "$RUNNER_TEMP/csm" checkout --detach facfd066bfbd632c815508e998bfd8b7665b8122
          cd "$RUNNER_TEMP/csm"
          RUSTFLAGS="-C target-cpu=native" cargo build --locked --release -p csm-cli --bin main
      - name: Download verified Q8 weights
        timeout-minutes: 4
        run: |
          curl --fail --location --silent --show-error --max-time 210 https://huggingface.co/cartesia/azzurra-voice/resolve/main/q8.gguf -o "$RUNNER_TEMP/azzurra-q8.gguf"
          echo "b0f0c5f9178e9b6c6f5034220023e40c3904eb035a679b0362ca6831e4360f9b  $RUNNER_TEMP/azzurra-q8.gguf" | sha256sum -c -
      - name: Generate five actual scenes and lossless montage
        timeout-minutes: 20
        run: python services/audio-factory/af08_v7_production.py --engine "$RUNNER_TEMP/csm/target/release/main" --weights "$RUNNER_TEMP/azzurra-q8.gguf" --output af08-v7
      - name: Install independent CPU ASR
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --retries 0 "faster-whisper==1.2.1" "ctranslate2==4.9.0"
      - name: Blind transcription and lexical review
        timeout-minutes: 6
        run: python services/audio-factory/af08_v7_production.py --output af08-v7 --asr
      - name: Preserve source tracks montage and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af08-missione118-v7-audio
          path: af08-v7/
          if-no-files-found: warn
          retention-days: 7
